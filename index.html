<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sokak adını söyleyin veya yazın, mahallesini öğrenin">
  <meta name="theme-color" content="#0A0E17">
  <title>Sokak Mahalle Bulucu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #0A0E17;
      --bg-panel: #0F1523;
      --bg-panel-2: #131B2C;
      --tint-rgb: 255,255,255;
      --line: rgba(var(--tint-rgb),0.08);
      --line-strong: rgba(var(--tint-rgb),0.14);
      --text-primary: #E7ECF5;
      --text-muted: #7C8797;
      --accent: #FF6B1A;
      --accent-dim: rgba(255,107,26,0.14);
      --cyan: #00E5C7;
      --cyan-dim: rgba(0,229,199,0.14);
      --success: #22D488;
      --success-dim: rgba(34,212,136,0.12);
      --error: #FF4D6D;
      --error-dim: rgba(255,77,109,0.12);
      --blue: #3B9EFF;
      --blue-dim: rgba(59,158,255,0.12);
      --yellow: #FACC15;
      --yellow-dim: rgba(250,204,21,0.12);
      --gray: #8B96A8;
      --gray-dim: rgba(139,150,168,0.12);
      --white-grp: #CBD4E1;
      --white-dim: rgba(203,212,225,0.1);
      --btn-primary-hover: #ffffff;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --display: 'Space Grotesk', sans-serif;
      --body: 'Inter', -apple-system, sans-serif;
    }

    /* ================= Açık Tema ================= */
    :root[data-theme="light"] {
      --bg-deep: #F2F4F9;
      --bg-panel: #FFFFFF;
      --bg-panel-2: #FAFBFD;
      --tint-rgb: 15,23,35;
      --text-primary: #16202E;
      --text-muted: #5B6577;
      --accent: #FF6B1A;
      --accent-dim: rgba(255,107,26,0.10);
      --cyan: #0891B2;
      --cyan-dim: rgba(8,145,178,0.10);
      --success: #16A34A;
      --success-dim: rgba(22,163,74,0.10);
      --error: #DC2626;
      --error-dim: rgba(220,38,38,0.10);
      --blue: #2563EB;
      --blue-dim: rgba(37,99,235,0.10);
      --yellow: #B45309;
      --yellow-dim: rgba(180,83,9,0.10);
      --gray: #64748B;
      --gray-dim: rgba(100,116,139,0.10);
      --white-grp: #334155;
      --white-dim: rgba(51,65,85,0.06);
      --btn-primary-hover: #101826;
    }

    /* ================= Tema Değiştirme Butonu ================= */
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(var(--tint-rgb),0.05);
      border: 1px solid var(--line-strong);
      border-radius: 2rem;
      padding: 0.4rem 0.9rem;
      font-family: var(--body);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      margin-left: auto;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .theme-toggle .theme-icon {
      font-size: 0.9rem;
      line-height: 1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--body);
      background:
        radial-gradient(circle at 15% 0%, rgba(255,107,26,0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 100%, rgba(0,229,199,0.06) 0%, transparent 45%),
        var(--bg-deep);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(var(--tint-rgb),0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--tint-rgb),0.025) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      z-index: 0;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 20%, black 40%, transparent 100%);
    }

    .container {
      max-width: 960px;
      margin: 1.5rem auto;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      padding-left: 0.15rem;
    }

    .eyebrow .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .header {
      background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
      border: 1px solid var(--line);
      border-bottom: none;
      border-radius: 1rem 1rem 0 0;
      padding: 0.75rem 2rem 0.75rem;
      position: relative;
      overflow: hidden;
      text-align: left;
    }

    .header::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--cyan));
    }

    h1 {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .main {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-top: none;
      border-bottom: none;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: flex-end;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .field {
      flex: 1 1 340px;
      position: relative;
    }

    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 0.4rem);
      left: 0;
      right: 0;
      background: var(--bg-panel-2);
      border: 1px solid var(--line-strong);
      border-radius: 0.6rem;
      max-height: 280px;
      overflow-y: auto;
      z-index: 50;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    }

    .autocomplete-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 1rem;
      font-family: var(--body);
      font-size: 0.9rem;
      color: var(--text-primary);
      cursor: pointer;
      border-bottom: 1px solid var(--line);
      transition: background 0.12s;
    }

    .autocomplete-item:last-child { border-bottom: none; }

    .autocomplete-item:hover,
    .autocomplete-item.active {
      background: var(--accent-dim);
    }

    .autocomplete-ad mark {
      background: transparent;
      color: var(--accent);
      font-weight: 700;
    }

    .autocomplete-mahalle {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    label {
      display: block;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    input {
      width: 100%;
      padding: 0.85rem 1rem;
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--text-primary);
      border: 1px solid var(--line-strong);
      border-radius: 0.6rem;
      background: rgba(var(--tint-rgb),0.02);
      transition: all 0.2s;
    }

    input::placeholder { color: #4A5468; }

    input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255,107,26,0.04);
      box-shadow: 0 0 0 3px rgba(255,107,26,0.12);
    }

    .buttons {
      display: flex;
      gap: 0.6rem;
      flex: 0 0 auto;
    }

    @media (max-width: 640px) {
      .main { flex-direction: column; align-items: stretch; }
      .field { flex: 1 1 auto; }
      .buttons { flex-direction: row; }
    }

    button {
      padding: 0.8rem 1.4rem;
      border: 1px solid transparent;
      border-radius: 0.6rem;
      font-family: var(--body);
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-search {
      flex: 1;
      background: var(--text-primary);
      color: var(--bg-deep);
    }

    .btn-search:hover {
      background: #fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(var(--tint-rgb),0.15);
    }

    .btn-voice {
      background: var(--accent);
      color: #fff;
      padding: 0.8rem 1.1rem;
    }

    .btn-voice:hover {
      background: #FF7A33;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(255,107,26,0.35);
    }

    .btn-voice.listening {
      animation: pulse 1.3s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,26,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(255,107,26,0); }
    }

    .btn-clear {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--line-strong);
      padding: 0.8rem 1.1rem;
    }

    .btn-clear:hover {
      border-color: var(--text-muted);
      color: var(--text-primary);
    }

    .result {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 0 0 1rem 1rem;
      padding: 1.75rem;
      border-top: none;
    }

    .result-box {
      border-radius: 0.6rem;
      padding: 1.25rem 1.4rem;
      border: 1px solid;
      background: rgba(var(--tint-rgb),0.015);
    }

    .result-success { border-color: rgba(34,212,136,0.35); background: var(--success-dim); }
    .result-error { border-color: rgba(255,77,109,0.35); background: var(--error-dim); }
    .result-warning { border-color: rgba(255,107,26,0.35); background: var(--accent-dim); }
    .result-listening { border-color: rgba(0,229,199,0.35); background: var(--cyan-dim); }

    .result-title {
      font-family: var(--mono);
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      font-weight: 600;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
    }

    .success-title { color: var(--success); }
    .error-title { color: var(--error); }
    .warning-title { color: var(--accent); }
    .listening-title { color: var(--cyan); }

    .sokak-name {
      font-family: var(--mono);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .mahalle-name {
      font-family: var(--display);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 0.35rem;
    }

    .sonaramalar-wrap {
      max-width: 960px;
      margin: 1.25rem auto 0;
    }

    .sonaramalar-section {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
    }

    .sonaramalar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .sonaramalar-title {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cyan);
    }

    .btn-sonaramalar-temizle {
      background: transparent;
      border: 1px solid var(--line-strong);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      border-radius: 2rem;
    }

    .btn-sonaramalar-temizle:hover {
      border-color: var(--error);
      color: var(--error);
    }

    .sonaramalar-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .chip-sonarama {
      background: rgba(0,229,199,0.06);
      border: 1px solid rgba(0,229,199,0.3);
      border-radius: 2rem;
      padding: 0.5rem 1rem;
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--cyan);
      cursor: pointer;
      transition: all 0.2s;
      text-transform: capitalize;
    }

    .chip-sonarama:hover {
      background: var(--cyan);
      border-color: var(--cyan);
      color: var(--bg-deep);
    }

    .chip-sonarama .chip-mahalle {
      font-family: var(--mono);
      font-size: 0.7rem;
      opacity: 0.75;
      margin-left: 0.35rem;
      text-transform: none;
    }

    .mahalle-wrap {
      max-width: 960px;
      margin: 1.25rem auto 0;
    }

    .mahalle-section {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 1.75rem 2rem;
    }

    .mahalle-section-title {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .btn-yonetim-ac {
      font-family: var(--body);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: normal;
      text-transform: none;
      color: var(--cyan);
      background: var(--cyan-dim);
      border: 1px solid rgba(0,229,199,0.35);
      border-radius: 2rem;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-yonetim-ac:hover {
      background: var(--cyan);
      color: #06231a;
      border-color: var(--cyan);
    }

    .mahalle-groups {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.1rem 1.4rem;
    }

    @media (max-width: 760px) {
      .mahalle-groups { grid-template-columns: 1fr; }
    }

    .grup-card {
      border: 3px solid var(--line-strong);
      border-radius: 0.75rem;
      padding: 1rem 1.1rem;
      background: rgba(var(--tint-rgb),0.012);
      box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 4px 12px rgba(0,0,0,0.03);
      position: relative;
      overflow: hidden;
    }

    /* Açık temada kart çizgisi ve gölgesi biraz daha belirgin olsun */
    :root[data-theme="light"] .grup-card {
      border-color: rgba(15,23,35,0.22);
      box-shadow: 0 1px 3px rgba(15,23,35,0.06), 0 6px 16px rgba(15,23,35,0.05);
    }

    .grup-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--grup-renk, var(--accent));
      opacity: 0.7;
    }

    .grup-card-title {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .grup-card-title .grup-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--grup-renk, var(--accent));
      box-shadow: 0 0 6px var(--grup-renk, var(--accent));
      flex-shrink: 0;
    }

    .mahalle-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .btn-mahalle {
      background: rgba(var(--tint-rgb),0.02);
      border: 2px solid var(--line-strong);
      border-radius: 2rem;
      padding: 0.5rem 1rem;
      font-family: var(--body);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-mahalle:not([class*="btn-mahalle-"]):hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-mahalle.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Grup renkleri */
    .btn-mahalle-gri { border-color: rgba(139,150,168,0.4); color: var(--gray); }
    .btn-mahalle-gri:hover, .btn-mahalle-gri.active { background: var(--gray); border-color: var(--gray); color: #0A0E17; }

    .btn-mahalle-yesil { border-color: rgba(34,212,136,0.4); color: var(--success); }
    .btn-mahalle-yesil:hover, .btn-mahalle-yesil.active { background: var(--success); border-color: var(--success); color: #0A0E17; }

    .btn-mahalle-kirmizi { border-color: rgba(255,77,109,0.4); color: var(--error); }
    .btn-mahalle-kirmizi:hover, .btn-mahalle-kirmizi.active { background: var(--error); border-color: var(--error); color: #0A0E17; }

    .btn-mahalle-mavi { border-color: rgba(59,158,255,0.4); color: var(--blue); }
    .btn-mahalle-mavi:hover, .btn-mahalle-mavi.active { background: var(--blue); border-color: var(--blue); color: #0A0E17; }

    .btn-mahalle-sari { border-color: rgba(250,204,21,0.4); color: var(--yellow); }
    .btn-mahalle-sari:hover, .btn-mahalle-sari.active { background: var(--yellow); border-color: var(--yellow); color: #0A0E17; }

    .btn-mahalle-beyaz { border-color: rgba(203,212,225,0.35); color: var(--white-grp); background: rgba(var(--tint-rgb),0.03); }
    .btn-mahalle-beyaz:hover, .btn-mahalle-beyaz.active { background: var(--white-grp); border-color: var(--white-grp); color: #0A0E17; }

    .btn-mahalle-turuncu { border-color: rgba(255,107,26,0.4); color: var(--accent); }
    .btn-mahalle-turuncu:hover, .btn-mahalle-turuncu.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .btn-mahalle-camgobegi { border-color: rgba(0,229,199,0.4); color: var(--cyan); }
    .btn-mahalle-camgobegi:hover, .btn-mahalle-camgobegi.active { background: var(--cyan); border-color: var(--cyan); color: #06231a; }

    /* Grup ayırıcı */
    .grup-ayirici {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin: 0.5rem 0;
    }

    .mahalle-detail {
      margin-top: 1.5rem;
      border-top: 1px solid var(--line);
      padding-top: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mahalle-detail-title {
      font-family: var(--display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .btn-geri {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0;
    }

    .btn-geri:hover { color: var(--accent); }

    .sokak-item {
      background: rgba(var(--tint-rgb),0.02);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      margin-bottom: 0.4rem;
      font-family: var(--mono);
      font-weight: 500;
      color: var(--text-primary);
      text-transform: capitalize;
      transition: all 0.2s;
    }

    .sokak-item:hover {
      border-color: var(--accent);
      background: rgba(255,107,26,0.04);
      transform: translateX(4px);
      color: var(--accent);
    }

    .logo-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      text-align: right;
      z-index: 1000;
      opacity: 0.9;
    }

    .logo-trendyol {
      font-family: var(--display);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .logo-trendyol-main {
      color: var(--text-primary);
      font-size: 24px;
      letter-spacing: -0.5px;
    }

    .logo-trendyol-express {
      color: var(--accent);
      font-size: 20px;
      letter-spacing: -0.3px;
    }

    .logo-subtitle {
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5,7,12,0.72);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }

    .modal-overlay.hidden { display: none; }

    .modal-box {
      background: var(--bg-panel);
      border: 1px solid var(--line-strong);
      border-radius: 1rem;
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .modal-header {
      background: var(--bg-panel-2);
      border-bottom: 1px solid var(--line);
      color: var(--text-primary);
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .modal-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--cyan));
    }

    .modal-header-title {
      font-family: var(--display);
      font-size: 1.15rem;
      font-weight: 700;
    }

    .modal-close {
      background: rgba(var(--tint-rgb),0.06);
      border: 1px solid var(--line-strong);
      color: var(--text-primary);
      font-size: 1.1rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }

    .modal-close:hover { background: rgba(255,107,26,0.15); border-color: var(--accent); }

    .modal-body {
      overflow-y: auto;
      padding: 1.25rem;
    }

    .modal-sokak-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.5rem;
    }

    @media (max-width: 560px) {
      .modal-sokak-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 380px) {
      .modal-sokak-grid { grid-template-columns: 1fr; }
    }

    .modal-sokak-item {
      background: rgba(var(--tint-rgb),0.02);
      border: 1px solid var(--line-strong);
      border-radius: 0.5rem;
      padding: 0.65rem 0.5rem;
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.7rem;
      line-height: 1.7;
      color: var(--text-primary);
      text-transform: capitalize;
      text-align: center;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 3px 8px rgba(0,0,0,0.03);
      transition: all 0.2s;
    }

    /* Açık temada sokak kartlarının çizgisi ve gölgesi daha belirgin olsun */
    :root[data-theme="light"] .modal-sokak-item {
      border-color: rgba(15,23,35,0.16);
      box-shadow: 0 1px 3px rgba(15,23,35,0.06), 0 4px 10px rgba(15,23,35,0.05);
    }

    .modal-sokak-item:hover {
      border-color: var(--accent);
      background: rgba(255,107,26,0.06);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .modal-alt-baslik {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--accent);
      margin: 1.1rem 0 0.6rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--line);
    }

    .modal-alt-baslik:first-child {
      margin-top: 0;
    }

    .modal-kisi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    @media (max-width: 480px) {
      .modal-kisi-grid { grid-template-columns: 1fr; }
    }

    .modal-kisi-kart {
      background: rgba(var(--tint-rgb),0.02);
      border: 2px solid var(--line-strong);
      border-radius: 0.75rem;
      padding: 1rem 0.75rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .modal-kisi-kart:hover {
      border-color: var(--accent);
      background: rgba(255,107,26,0.06);
      transform: translateY(-2px);
    }

    .modal-kisi-kart-silinebilir { padding-top: 1.35rem; }

    .modal-kisi-sil {
      position: absolute;
      top: 0.35rem;
      right: 0.35rem;
      background: var(--error-dim);
      color: var(--error);
      border: 1px solid rgba(255,77,109,0.3);
      border-radius: 0.25rem;
      width: 10px;
      height: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.4rem;
      line-height: 1;
      transition: all 0.2s;
    }

    .modal-kisi-sil:hover { background: var(--error); color: #fff; }

    .modal-kisi-ad {
      font-family: var(--display);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-primary);
      margin-bottom: 0.35rem;
    }

    .modal-kisi-sayi {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .modal-geri-satir {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      margin-bottom: 1rem;
      display: inline-block;
      transition: color 0.2s;
    }

    .modal-geri-satir:hover {
      color: var(--accent);
    }

    .hidden { display: none; }

    .yonetim-input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .yonetim-input {

      background: var(--success);

    // --- Esnek sokak eşleştirme ---
    // "Suna" da yazılsa "Suna Sokak" da yazılsa, veritabanında hangisi varsa onu bulur.
    function normalizeSokakAdi(str) {
      return str
        .toLocaleLowerCase('tr')
        .replace(/[.,]/g, '')
        .replace(/\b(sokak|sokağı|sk|caddesi|cadde|cad|bulvarı|bulvari|meydanı|meydani)\b/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // --- Kullanıcı tarafından eklenen/kaldırılan sokaklar (localStorage) ---
    const SOKAK_EKLENEN_ANAHTAR = 'sokakBulucu_eklenenSokaklar';
    const SOKAK_SILINEN_ANAHTAR = 'sokakBulucu_silinenSokaklar';

    function eklenenSokaklariGetir() {
      try {
        const veri = localStorage.getItem(SOKAK_EKLENEN_ANAHTAR);
        return veri ? JSON.parse(veri) : {};
      } catch (e) { return {}; }
    }

    function eklenenSokaklariKaydet(obj) {
      try { localStorage.setItem(SOKAK_EKLENEN_ANAHTAR, JSON.stringify(obj)); }
      catch (e) { /* depolama kullanılamıyorsa sessizce geç */ }
    }

    function silinenSokaklariGetir() {
      try {
        const veri = localStorage.getItem(SOKAK_SILINEN_ANAHTAR);
        return veri ? JSON.parse(veri) : [];
      } catch (e) { return []; }
    }

    function silinenSokaklariKaydet(liste) {
      try { localStorage.setItem(SOKAK_SILINEN_ANAHTAR, JSON.stringify(liste)); }
      catch (e) { /* depolama kullanılamıyorsa sessizce geç */ }
    }

    // Etkin sokak listesi: temel veri + kullanıcı eklemeleri - kullanıcı silmeleri
    let sokaklar = {};
    let sokaklarNormalize = {};

    function sokaklariYenidenOlustur() {
      Object.keys(sokaklar).forEach(k => delete sokaklar[k]);
      Object.assign(sokaklar, sokaklarTemel);

      const silinen = silinenSokaklariGetir();
      silinen.forEach(k => delete sokaklar[k]);

      const eklenen = eklenenSokaklariGetir();
      Object.assign(sokaklar, eklenen);

      Object.keys(sokaklarNormalize).forEach(k => delete sokaklarNormalize[k]);
      Object.keys(sokaklar).forEach(key => {
        const norm = normalizeSokakAdi(key);
        if (!(norm in sokaklarNormalize)) {
          sokaklarNormalize[norm] = key;
        }
      });
    }

    sokaklariYenidenOlustur();

    // Yeni bir sokak ekler (varsa üzerine yazar) ve verileri kalıcı hale getirir
    function sokakEkleVeriye(sokakAdiHam, mahalleKey) {
      const sokakAdi = sokakAdiHam.toLocaleLowerCase('tr').trim();
      if (!sokakAdi) return false;

      const silinen = silinenSokaklariGetir().filter(k => k !== sokakAdi);
      silinenSokaklariKaydet(silinen);

      const eklenen = eklenenSokaklariGetir();
      eklenen[sokakAdi] = mahalleKey;
      eklenenSokaklariKaydet(eklenen);

      sokaklariYenidenOlustur();
      return true;
    }

    // Bir sokağı veriden kaldırır ve kalıcı hale getirir
    function sokakKaldirVeriden(sokakAdi) {
      const eklenen = eklenenSokaklariGetir();
      if (sokakAdi in eklenen) {
        delete eklenen[sokakAdi];
        eklenenSokaklariKaydet(eklenen);
      } else {
        const silinen = silinenSokaklariGetir();
        if (!silinen.includes(sokakAdi)) {
          silinen.push(sokakAdi);
          silinenSokaklariKaydet(silinen);
        }
      }
      sokaklariYenidenOlustur();
    }

    // Girilen/söylenen sokak adına göre mahalleyi bulur (önce tam eşleşme, sonra esnek eşleşme)
    function sokakBul(girilenAd) {
      const aranan = girilenAd.toLocaleLowerCase('tr').trim();

      if (sokaklar[aranan]) return sokaklar[aranan];

      const normAranan = normalizeSokakAdi(girilenAd);
      const eslesenKey = sokaklarNormalize[normAranan];
      if (eslesenKey) return sokaklar[eslesenKey];

      return null;
    }


    // Sokak listesini Türkçe alfabetik sıraya göre diz
    function sokaklariSirala(liste) {
      return [...liste].sort((a, b) => a.localeCompare(b, 'tr'));
    }

    // --- Son Aranananlar ---
    const SON_ARAMALAR_ANAHTAR = 'sokakBulucu_sonAramalar';
    const SON_ARAMALAR_MAKS = 10;

    function sonAramalariGetir() {
      try {
        const veri = localStorage.getItem(SON_ARAMALAR_ANAHTAR);
        return veri ? JSON.parse(veri) : [];
      } catch (e) {
        return [];
      }
    }

    function sonAramaEkle(sokakAdi, mahalle) {
      let liste = sonAramalariGetir();
      // Aynı sokak zaten listede varsa çıkar, en başa tekrar eklenecek
      liste = liste.filter(item => item.sokak.toLocaleLowerCase('tr') !== sokakAdi.toLocaleLowerCase('tr'));
      liste.unshift({ sokak: sokakAdi, mahalle: mahalle });
      liste = liste.slice(0, SON_ARAMALAR_MAKS);
      try {
        localStorage.setItem(SON_ARAMALAR_ANAHTAR, JSON.stringify(liste));
      } catch (e) { /* depolama kullanılamıyorsa sessizce geç */ }
      sonAramalariGoster();
    }

    function sonAramalariTemizle() {
      try {
        localStorage.removeItem(SON_ARAMALAR_ANAHTAR);
      } catch (e) { /* yoksay */ }
      sonAramalariGoster();
    }

    function sonAramalariGoster() {
      const liste = sonAramalariGetir();
      const wrap = document.getElementById('sonAramalarWrap');
      const chipsDiv = document.getElementById('sonAramalarChips');

      if (!liste.length) {
        wrap.classList.add('hidden');
        return;
      }

      wrap.classList.remove('hidden');
      chipsDiv.innerHTML = '';

      liste.forEach(item => {
        const chip = document.createElement('button');
        chip.className = 'chip-sonarama';
        chip.innerHTML = `${item.sokak}<span class="chip-mahalle">${item.mahalle}</span>`;
        chip.onclick = () => {
          document.getElementById('sokakInput').value = item.sokak;
          ara();
        };
        chipsDiv.appendChild(chip);
      });
    }

    let dinliyor = false;

    // ================= Autocomplete (öneri açılır menüsü) =================
    let acOneriler = [];
    let acSeciliIndex = -1;

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function capitalizeSokak(str) {
      return str.replace(/\S+/g, kelime => kelime.charAt(0).toLocaleUpperCase('tr') + kelime.slice(1));
    }

    // Eşleşen kısmı vurgulayarak HTML üretir
    function vurguluMetin(gosterimAdi, qLower) {
      const lower = gosterimAdi.toLocaleLowerCase('tr');
      const idx = qLower ? lower.indexOf(qLower) : -1;
      if (idx === -1) return escapeHtml(gosterimAdi);
      return escapeHtml(gosterimAdi.slice(0, idx)) +
        '<mark>' + escapeHtml(gosterimAdi.slice(idx, idx + qLower.length)) + '</mark>' +
        escapeHtml(gosterimAdi.slice(idx + qLower.length));
    }

    // Girilen metne göre öneri listesi çıkarır: önce birebir içerenler, sonra ek/kelime farkı gözetmeksizin eşleşenler
    function sokakOneriListesi(query) {
      const qLower = query.toLocaleLowerCase('tr').trim();
      if (!qLower) return [];
      const qNorm = normalizeSokakAdi(query);
      const tumSokaklar = Object.keys(sokaklar);

      const duzEslesen = tumSokaklar
        .filter(k => k.includes(qLower))
        .sort((a, b) => a.localeCompare(b, 'tr'));

      const normEslesen = tumSokaklar
        .filter(k => !k.includes(qLower) && normalizeSokakAdi(k).includes(qNorm))
        .sort((a, b) => a.localeCompare(b, 'tr'));

      return [...duzEslesen, ...normEslesen].slice(0, 8);
    }

    function autocompleteGoster(query) {
      const dropdown = document.getElementById('autocompleteDropdown');
      acOneriler = sokakOneriListesi(query);
      acSeciliIndex = -1;

      if (acOneriler.length === 0) {
        autocompleteGizle();
        return;
      }

      const qLower = query.toLocaleLowerCase('tr').trim();
      dropdown.innerHTML = acOneriler.map((key, i) => {
        const gosterimAdi = capitalizeSokak(key);
        return `
          <div class="autocomplete-item" data-idx="${i}" onmousedown="autocompleteSec(${i})">
            <span class="autocomplete-ad">${vurguluMetin(gosterimAdi, qLower)}</span>
            <span class="autocomplete-mahalle">${sokaklar[key]}</span>
          </div>
        `;
      }).join('');
      dropdown.classList.remove('hidden');
    }

    function autocompleteGizle() {
      const dropdown = document.getElementById('autocompleteDropdown');
      dropdown.classList.add('hidden');
      dropdown.innerHTML = '';
      acOneriler = [];
      acSeciliIndex = -1;
    }

    function autocompleteVurguYenile() {
      const dropdown = document.getElementById('autocompleteDropdown');
      Array.from(dropdown.children).forEach((el, i) => {
        el.classList.toggle('active', i === acSeciliIndex);
      });
      const aktifEl = dropdown.children[acSeciliIndex];
      if (aktifEl) aktifEl.scrollIntoView({ block: 'nearest' });
    }

    // Öneriye tıklanınca/seçilince: input'a yaz ve ara
    function autocompleteSec(i) {
      const key = acOneriler[i];
      if (!key) return;
      document.getElementById('sokakInput').value = capitalizeSokak(key);
      autocompleteGizle();
      ara();
    }

    const sokakInputEl = document.getElementById('sokakInput');

    sokakInputEl.addEventListener('input', function(e) {
      autocompleteGoster(e.target.value);
    });

    sokakInputEl.addEventListener('focus', function(e) {
      if (e.target.value.trim()) autocompleteGoster(e.target.value);
    });

    // Dropdown dışına tıklanınca kapat (öge tıklaması onmousedown ile önce yakalanıyor)
    sokakInputEl.addEventListener('blur', function() {
      setTimeout(autocompleteGizle, 150);
    });

    // Klavye: yukarı/aşağı ile öneriler arasında gezinme, Enter ile seçim/arama, Escape ile kapatma
    sokakInputEl.addEventListener('keydown', function(e) {
      const dropdown = document.getElementById('autocompleteDropdown');
      const dropdownAcik = !dropdown.classList.contains('hidden') && acOneriler.length > 0;

      if (e.key === 'ArrowDown') {
        if (dropdownAcik) {
          e.preventDefault();
          acSeciliIndex = (acSeciliIndex + 1) % acOneriler.length;
          autocompleteVurguYenile();
        }
      } else if (e.key === 'ArrowUp') {
        if (dropdownAcik) {
          e.preventDefault();
          acSeciliIndex = (acSeciliIndex - 1 + acOneriler.length) % acOneriler.length;
          autocompleteVurguYenile();
        }
      } else if (e.key === 'Enter') {
        if (dropdownAcik && acSeciliIndex >= 0) {
          e.preventDefault();
          autocompleteSec(acSeciliIndex);
        } else {
          ara();
          autocompleteGizle();
        }
      } else if (e.key === 'Escape') {
        autocompleteGizle();
      }
    });

    // Arama fonksiyonu
    function ara() {
      const input = document.getElementById('sokakInput').value;
      const aranan = input.toLowerCase().trim();
      const resultDiv = document.getElementById('result');

      if (!aranan) {
        gosterSonuc('error', '❌ Uyarı', 'Lütfen bir sokak adı girin!');
        return;
      }

      const mahalle = sokakBul(input);

      if (mahalle) {
        gosterSonuc('success', '✅ Bulundu!', 
          `<div class="sokak-name">${input}</div><div class="mahalle-name">${mahalle}</div>`);
        sesliSoyle(mahalle);
        sonAramaEkle(input, mahalle);
      } else {
        gosterSonuc('warning', '⚠️ Bulunamadı', 'Bu sokak veritabanında bulunamadı.');
      }
    }

    // Sesli konuşma fonksiyonu
    function sesliSoyle(metin) {
      // Önceki konuşmaları iptal et
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(metin);
      utterance.lang = 'tr-TR';
      utterance.rate = 1.2;
      utterance.pitch = 1;
      utterance.volume = 1;
      
      // Hemen konuş
      window.speechSynthesis.speak(utterance);
    }

    // Sesli arama
    function sesliAra() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        gosterSonuc('error', '❌ Uyarı', 'Tarayıcınız ses tanımayı desteklemiyor. Lütfen Chrome veya Edge kullanın.');
        sesliSoyle('Tarayıcınız ses tanımayı desteklemiyor.');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = false;
      recognition.interimResults = false;

      const voiceBtn = document.getElementById('voiceBtn');

      recognition.onstart = () => {
        dinliyor = true;
        voiceBtn.classList.add('listening');
        voiceBtn.textContent = '🔴 Dinliyor...';
        gosterSonuc('listening', '🎤 Dinliyorum', 'Sokak adını söyleyin...');
      };

      recognition.onresult = (event) => {
        const sesliBilgi = event.results[0][0].transcript;
        document.getElementById('sokakInput').value = sesliBilgi;
        
        const mahalle = sokakBul(sesliBilgi);

        if (mahalle) {
          gosterSonuc('success', '✅ Bulundu!', 
            `<div class="sokak-name">${sesliBilgi}</div><div class="mahalle-name">${mahalle}</div>`);
          sesliSoyle(mahalle);
          sonAramaEkle(sesliBilgi, mahalle);
        } else {
          gosterSonuc('warning', '⚠️ Bulunamadı', 'Bu sokak veritabanında bulunamadı.');
          sesliSoyle('Bulunamadı');
        }
      };

      recognition.onerror = () => {
        gosterSonuc('error', '❌ Hata', 'Ses tanıma hatası. Lütfen tekrar deneyin.');
        sesliSoyle('Ses tanıma hatası. Lütfen tekrar deneyin.');
      };

      recognition.onend = () => {
        dinliyor = false;
        voiceBtn.classList.remove('listening');
        voiceBtn.textContent = '🎤';
      };

      recognition.start();
    }

    // Temizle
    function temizle() {
      document.getElementById('sokakInput').value = '';
      document.getElementById('result').classList.add('hidden');
      autocompleteGizle();
    }

    // Sonuç göster
    function gosterSonuc(tip, baslik, mesaj) {
      const resultDiv = document.getElementById('result');
      const tipClass = `result-${tip}`;
      const titleClass = `${tip}-title`;

      resultDiv.innerHTML = `
        <div class="result-box ${tipClass}">
          <div class="result-title ${titleClass}">${baslik}</div>
          <div>${mesaj}</div>
        </div>
      `;
      resultDiv.classList.remove('hidden');
    }

    // Mahalleleri grupla
    function mahalleSokakMap() {
      const map = {};
      Object.entries(sokaklar).forEach(([sokak, mahalle]) => {
        if (!map[mahalle]) map[mahalle] = [];
        map[mahalle].push(sokak);
      });
      return map;
    }

    // Mahalle grupları (temel/sabit veri — kullanıcı eklemeleri buna dokunmaz)
    const mahalleGruplariTemel = [
      {
        renk: 'mavi',
        mahalleler: [
          'FSM 1', 'FSM 2', 'FSM 3', 'FSM 4',
          'Köseköy 1', 'Sarımeşe 1', 'İstasyon 1'
        ]
      },
      {
        renk: 'gri',
        mahalleler: ['Arslanbey 1', 'Arslanbey 2', 'Balaban 1', 'Derbent 1', 'Maşukiye 1', 'Suadiye 1']
      },
      {
        renk: 'yesil',
        mahalleler: ['Ataevler 1', 'Ataevler 2', 'Ataevler 3', 'Emekevler 1', 'Uzunçiftlik 1']
      },
      {
        renk: 'kirmizi',
        mahalleler: ['Dumlupınar 1', 'Dumlupınar 2', 'Ertuğrul 1', 'Eşme 1']
      },
      {
        renk: 'sari',
        mahalleler: ['Karabaş 1', 'Tepecik 1', 'Ömerağa 1']
      },
      {
        renk: 'beyaz',
        mahalleler: ['Körfez 1', 'Körfez 2']
      }
    ];

    // Grup renklerinin CSS değişken karşılıkları
    const grupRenkDegiskeni = {
      gri: 'var(--gray)',
      yesil: 'var(--success)',
      kirmizi: 'var(--error)',
      mavi: 'var(--blue)',
      sari: 'var(--yellow)',
      beyaz: 'var(--white-grp)',
      turuncu: 'var(--accent)',
      camgobegi: 'var(--cyan)'
    };

    // Yeni eklenen bölgelere sırayla atanacak renkler
    const BOLGE_RENK_DONGUSU = ['turuncu', 'camgobegi', 'mavi', 'yesil', 'kirmizi', 'sari', 'gri', 'beyaz'];

    // ================= Bölge / Mahalle Ekle-Kaldır Depolama =================
    const BOLGE_EKLENEN_ANAHTAR = 'sokakBulucu_eklenenBolgeler';
    const BOLGE_SILINEN_ANAHTAR = 'sokakBulucu_silinenBolgeler';
    const MAHALLE_EKLENEN_ANAHTAR = 'sokakBulucu_eklenenMahalleler';
    const MAHALLE_SILINEN_ANAHTAR = 'sokakBulucu_silinenMahalleler';

    function eklenenBolgeleriGetir() {
      try {
        const veri = localStorage.getItem(BOLGE_EKLENEN_ANAHTAR);
        return veri ? JSON.parse(veri) : [];
      } catch (e) { return []; }
    }

    function eklenenBolgeleriKaydet(liste) {
      try { localStorage.setItem(BOLGE_EKLENEN_ANAHTAR, JSON.stringify(liste)); }
      catch (e) { /* depolama kullanılamıyorsa sessizce geç */ }
    }

    // Kullanıcının kaldırdığı temel (sabit) bölgelerin id listesi
    function silinenBolgeleriGetir() {
      try {
        const veri = localStorage.getItem(BOLGE_SILINEN_ANAHTAR);
        return veri ? JSON.parse(veri) : [];
      } catch (e) { return []; }
    }

    function silinenBolgeleriKaydet(liste) {
      try { localStorage.setItem(BOLGE_SILINEN_ANAHTAR, JSON.stringify(liste)); }
      catch (e) { /* depolama kullanılamıyorsa sessizce geç */ }
    }

    function eklenenMahalleleriGetir() {
      try {
        const veri = localStorage.getItem(MAHALLE_EKLENEN_ANAHTAR);
        return veri ? JSON.parse(veri) : {};
      } catch (e) { return {}; }
    }

    function eklenenMahalleleriKaydet(obj) {
      try { localStorage.setItem(MAHALLE_EKLENEN_ANAHTAR, JSON.stringify(obj)); }
      catch (e) { /* depolama kullanılamıyorsa sessizce geç */ }
    }

    // Kullanıcının kaldırdığı temel (sabit) mahallelerin key listesi
    function silinenMahalleleriGetir() {
      try {
        const veri = localStorage.getItem(MAHALLE_SILINEN_ANAHTAR);
        return veri ? JSON.parse(veri) : [];
      } catch (e) { return []; }
    }

    function silinenMahalleleriKaydet(liste) {
      try { localStorage.setItem(MAHALLE_SILINEN_ANAHTAR, JSON.stringify(liste)); }
      catch (e) { /* depolama kullanılamıyorsa sessizce geç */ }
    }

    function yeniBolgeIdUret() {
      return 'ozel-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
    }

    // Etkin bölge/mahalle listesi: temel veri + kullanıcı eklemeleri/kaldırmaları birleştirilerek oluşturulur
    let mahalleGruplari = [];

    function mahalleGruplariYenidenOlustur() {
      const eklenenMahalleler = eklenenMahalleleriGetir();
      const eklenenBolgeler = eklenenBolgeleriGetir();
      const silinenBolgeler = silinenBolgeleriGetir();
      const silinenMahalleler = silinenMahalleleriGetir();
      const yeniListe = [];

      mahalleGruplariTemel.forEach((grup, idx) => {
        const id = 'temel-' + idx;
        if (silinenBolgeler.includes(id)) return;

        const temelMahalleler = grup.mahalleler
          .map(item => {
            const key = typeof item === 'string' ? item : item.key;
            const label = typeof item === 'string' ? item : item.label;
            return { key, label, ozel: false };
          })
          .filter(m => !silinenMahalleler.includes(m.key));
        const ekMahalleler = (eklenenMahalleler[id] || []).map(m => ({ key: m.key, label: m.label, ozel: true }));
        yeniListe.push({
          id,
          ad: null,
          renk: grup.renk,
          ozel: false,
          mahalleler: temelMahalleler.concat(ekMahalleler)
        });
      });

      eklenenBolgeler.forEach(bolge => {
        const ekMahalleler = (eklenenMahalleler[bolge.id] || []).map(m => ({ key: m.key, label: m.label, ozel: true }));
        yeniListe.push({
          id: bolge.id,
          ad: bolge.ad,
          renk: bolge.renk,
          ozel: true,
          mahalleler: ekMahalleler
        });
      });

      mahalleGruplari.length = 0;
      yeniListe.forEach(g => mahalleGruplari.push(g));
    }

    mahalleGruplariYenidenOlustur();

    // Belirtilen isimde (büyük/küçük harf duyarsız) bir mahalle zaten var mı?
    function mahalleVarMi(adayAd) {
      const norm = adayAd.toLocaleLowerCase('tr').trim();
      return mahalleGruplari.some(g => g.mahalleler.some(m => m.key.toLocaleLowerCase('tr').trim() === norm));
    }

    // Yeni bölge ekler (isteğe bağlı bir renk döngüsüyle) ve kalıcı hale getirir
    function bolgeEkleVeriye(ad) {
      const temizAd = ad.trim();
      if (!temizAd) return false;

      const eklenen = eklenenBolgeleriGetir();
      const renk = BOLGE_RENK_DONGUSU[eklenen.length % BOLGE_RENK_DONGUSU.length];
      eklenen.push({ id: yeniBolgeIdUret(), ad: temizAd, renk });
      eklenenBolgeleriKaydet(eklenen);

      mahalleGruplariYenidenOlustur();
      return true;
    }

    // Bir bölgeyi kaldırır: özel (kullanıcı eklemiş) bölgeyse listeden çıkarır,
    // temel (sabit) bölgeyse "silinen" listesine ekleyerek gizler. Her iki durumda
    // da o bölgeye eklenmiş mahalleler de birlikte temizlenir.
    function bolgeKaldirVeriden(bolgeId) {
      if (bolgeId.startsWith('ozel-')) {
        let eklenen = eklenenBolgeleriGetir();
        eklenen = eklenen.filter(b => b.id !== bolgeId);
        eklenenBolgeleriKaydet(eklenen);
      } else {
        const silinen = silinenBolgeleriGetir();
        if (!silinen.includes(bolgeId)) {
          silinen.push(bolgeId);
          silinenBolgeleriKaydet(silinen);
        }
      }

      const eklenenMahalleler = eklenenMahalleleriGetir();
      if (eklenenMahalleler[bolgeId]) {
        delete eklenenMahalleler[bolgeId];
        eklenenMahalleleriKaydet(eklenenMahalleler);
      }

      mahalleGruplariYenidenOlustur();
    }

    // Belirtilen bölgeye yeni bir mahalle ekler; isim boşsa veya zaten varsa hata döner
    function bolgeyeMahalleEkle(bolgeId, label) {
      const temizLabel = label.trim();
      if (!temizLabel) return { basarili: false, mesaj: 'Mahalle adı boş olamaz.' };
      if (mahalleVarMi(temizLabel)) return { basarili: false, mesaj: 'Bu isimde bir mahalle zaten var.' };

      const eklenenMahalleler = eklenenMahalleleriGetir();
      if (!eklenenMahalleler[bolgeId]) eklenenMahalleler[bolgeId] = [];
      eklenenMahalleler[bolgeId].push({ key: temizLabel, label: temizLabel });
      eklenenMahalleleriKaydet(eklenenMahalleler);

      mahalleGruplariYenidenOlustur();
      return { basarili: true };
    }

    // Bir bölgeden, kullanıcı tarafından eklenmiş bir mahalleyi kaldırır
    // Bir bölgeden bir mahalleyi kaldırır: özel (kullanıcı eklemiş) mahalleyse
    // listeden tamamen çıkarır, temel (sabit) mahalleyse "silinen" listesine
    // ekleyerek gizler.
    function bolgedenMahalleKaldir(bolgeId, key, ozelMi) {
      if (ozelMi) {
        const eklenenMahalleler = eklenenMahalleleriGetir();
        if (eklenenMahalleler[bolgeId]) {
          eklenenMahalleler[bolgeId] = eklenenMahalleler[bolgeId].filter(m => m.key !== key);
          eklenenMahalleleriKaydet(eklenenMahalleler);
        }
      } else {
        const silinen = silinenMahalleleriGetir();
        if (!silinen.includes(key)) {
          silinen.push(key);
          silinenMahalleleriKaydet(silinen);
        }
      }
      mahalleGruplariYenidenOlustur();
    }

    // Mahalle butonlarını gruplu, kart bazlı oluştur (3 üstte / 3 altta ızgara)
    function mahalleButonlariOlustur() {
      const map = mahalleSokakMap();
      const container = document.getElementById('mahalleButtons');
      container.innerHTML = '';

      mahalleGruplari.forEach((grup, idx) => {
        const card = document.createElement('div');
        card.className = 'grup-card';
        card.style.setProperty('--grup-renk', grupRenkDegiskeni[grup.renk] || 'var(--accent)');

        const title = document.createElement('div');
        title.className = 'grup-card-title';
        title.innerHTML = `<span class="grup-dot"></span>${grup.ad || 'Bölge ' + (idx + 1)}`;
        card.appendChild(title);

        const btnWrap = document.createElement('div');
        btnWrap.className = 'mahalle-buttons';

        grup.mahalleler.forEach(item => {
          const key = typeof item === 'string' ? item : item.key;
          const label = typeof item === 'string' ? item : item.label;
          if (!map[key]) return;
          const btn = document.createElement('button');
          btn.className = 'btn-mahalle btn-mahalle-' + grup.renk;
          btn.textContent = label;
          btn.onclick = () => mahalleAc(key, btn, label);
          btnWrap.appendChild(btn);
        });

        card.appendChild(btnWrap);
        container.appendChild(card);
      });
    }

    // Mahalle detayını modal olarak aç
    function mahalleAc(mahalle, btnEl, gosterilecekAd) {
      document.querySelectorAll('.btn-mahalle').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');

      const map = mahalleSokakMap();
      const body = document.getElementById('modalBody');
      body.innerHTML = '';
      const sokakListesi = map[mahalle] || [];

      const baslik = mahalle;
      const sesMetni = mahalle;

      document.getElementById('modalBaslik').textContent = '📍 ' + baslik;
      sesliSoyle(sesMetni);
      const grid = document.createElement('div');
      grid.className = 'modal-sokak-grid';
      sokaklariSirala(sokakListesi).forEach(sokak => {
        const div = document.createElement('div');
        div.className = 'modal-sokak-item';
        div.textContent = sokak;
        grid.appendChild(div);
      });
      body.appendChild(grid);

      document.getElementById('modalOverlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    // ================= Sokak Ekle / Kaldır Yönetimi =================
    let yonetimAktif = false;
    let yonetimSeciliBolgeIdx = null;
    let yonetimSeciliMahalleKey = null;
    let yonetimSeciliMahalleLabel = null;

    // Yönetim panelini aç: bölge seçim ekranıyla başlar
    function yonetimAc() {
      yonetimAktif = true;
      yonetimSeciliBolgeIdx = null;
      yonetimSeciliMahalleKey = null;
      yonetimSeciliMahalleLabel = null;

      document.getElementById('modalBaslik').textContent = '🛠️ Sokak Ekle / Kaldır';
      yonetimBolgeEkraniGoster();

      document.getElementById('modalOverlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    // 1. Adım: Bölge seçimi
    function yonetimBolgeEkraniGoster() {
      yonetimSeciliBolgeIdx = null;
      yonetimSeciliMahalleKey = null;
      yonetimSeciliMahalleLabel = null;

      const body = document.getElementById('modalBody');
      body.innerHTML = '';

      const baslik = document.createElement('div');
      baslik.className = 'modal-alt-baslik';
      baslik.textContent = 'Önce bölge seçin';
      body.appendChild(baslik);

      const grid = document.createElement('div');
      grid.className = 'modal-kisi-grid';

      mahalleGruplari.forEach((grup, idx) => {
        const kart = document.createElement('div');
        kart.className = 'modal-kisi-kart';
        kart.innerHTML = `
          <div class="modal-kisi-ad">${grup.ad || 'Bölge ' + (idx + 1)}</div>
          <div class="modal-kisi-sayi">${grup.mahalleler.length} mahalle</div>
        `;
        kart.onclick = () => yonetimBolgeSec(idx);
        grid.appendChild(kart);
      });

      body.appendChild(grid);
    }

    // 2. Adım: Seçilen bölgedeki mahalleleri göster
    function yonetimBolgeSec(idx) {
      yonetimSeciliBolgeIdx = idx;
      yonetimSeciliMahalleKey = null;
      yonetimSeciliMahalleLabel = null;

      const map = mahalleSokakMap();
      const grup = mahalleGruplari[idx];
      const body = document.getElementById('modalBody');
      body.innerHTML = '';

      const geri = document.createElement('div');
      geri.className = 'modal-geri-satir';
      geri.textContent = '← Bölgelere dön';
      geri.onclick = () => yonetimBolgeEkraniGoster();
      body.appendChild(geri);

      const baslik = document.createElement('div');
      baslik.className = 'modal-alt-baslik';
      baslik.textContent = `${grup.ad || 'Bölge ' + (idx + 1)} — mahalle seçin`;
      body.appendChild(baslik);

      const grid = document.createElement('div');
      grid.className = 'modal-kisi-grid';

      grup.mahalleler.forEach(item => {
        const key = typeof item === 'string' ? item : item.key;
        const label = typeof item === 'string' ? item : item.label;
        const sayi = (map[key] || []).length;

        const kart = document.createElement('div');
        kart.className = 'modal-kisi-kart';
        kart.innerHTML = `
          <div class="modal-kisi-ad">${label}</div>
          <div class="modal-kisi-sayi">${sayi} sokak</div>
        `;
        kart.onclick = () => yonetimMahalleSec(key, label);
        grid.appendChild(kart);
      });

      body.appendChild(grid);
    }

    // 3. Adım: Seçilen mahallede sokak ekle / kaldır ekranı
    function yonetimMahalleSec(key, label) {
      yonetimSeciliMahalleKey = key;
      yonetimSeciliMahalleLabel = label;
      yonetimEkleKaldirEkraniCiz();
    }

    function yonetimEkleKaldirEkraniCiz() {
      const key = yonetimSeciliMahalleKey;
      const label = yonetimSeciliMahalleLabel;
      const map = mahalleSokakMap();
      const body = document.getElementById('modalBody');
      body.innerHTML = '';

      const geri = document.createElement('div');
      geri.className = 'modal-geri-satir';
      geri.textContent = '← Mahallelere dön';
      geri.onclick = () => yonetimBolgeSec(yonetimSeciliBolgeIdx);
      body.appendChild(geri);

      const baslikEkle = document.createElement('div');
      baslikEkle.className = 'modal-alt-baslik';
      baslikEkle.textContent = `${label} — Sokak Ekle`;
      body.appendChild(baslikEkle);

      const inputRow = document.createElement('div');
      inputRow.className = 'yonetim-input-row';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'yonetim-input';
      input.id = 'yonetimSokakInput';
      input.placeholder = 'Örn: Papatya Sokak';
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') yonetimSokakEkleTikla();
      });
      inputRow.appendChild(input);

      const ekleBtn = document.createElement('button');
      ekleBtn.className = 'yonetim-ekle-btn';
      ekleBtn.textContent = '+ Ekle';
      ekleBtn.onclick = () => yonetimSokakEkleTikla();
      inputRow.appendChild(ekleBtn);

      body.appendChild(inputRow);

      const not = document.createElement('div');
      not.className = 'yonetim-not';
      not.textContent = `Eklenen sokak "${label}" mahallesine kaydedilir.`;
      body.appendChild(not);

      const baslikListe = document.createElement('div');
      baslikListe.className = 'modal-alt-baslik';
      const sokaklarListesi = sokaklariSirala(map[key] || []);
      baslikListe.textContent = `Kayıtlı Sokaklar (${sokaklarListesi.length})`;
      body.appendChild(baslikListe);

      if (sokaklarListesi.length === 0) {
        const bos = document.createElement('div');
        bos.className = 'yonetim-bos';
        bos.textContent = 'Bu mahallede henüz sokak yok.';
        body.appendChild(bos);
      } else {
        const liste = document.createElement('div');
        liste.className = 'yonetim-sokak-liste';

        sokaklarListesi.forEach(sokak => {
          const satir = document.createElement('div');
          satir.className = 'yonetim-sokak-satir';

          const ad = document.createElement('div');
          ad.className = 'yonetim-sokak-ad';
          ad.textContent = sokak;
          satir.appendChild(ad);

          const silBtn = document.createElement('button');
          silBtn.className = 'yonetim-sil-btn';
          silBtn.textContent = '✕';
          silBtn.title = 'Sokağı kaldır';
          silBtn.onclick = () => yonetimSokakKaldirTikla(sokak);
          satir.appendChild(silBtn);

          liste.appendChild(satir);
        });

        body.appendChild(liste);
      }
    }

    // Ekle butonuna tıklanınca çalışır
    function yonetimSokakEkleTikla() {
      const input = document.getElementById('yonetimSokakInput');
      const deger = input.value.trim();
      if (!deger) return;

      sokakEkleVeriye(deger, yonetimSeciliMahalleKey);
      yonetimEkleKaldirEkraniCiz();

      // Yeni eklenen sokağın altında input'a odaklan, hızlı ardışık ekleme için
      const yeniInput = document.getElementById('yonetimSokakInput');
      if (yeniInput) yeniInput.focus();
    }

    // Kaldır (✕) butonuna tıklanınca çalışır
    function yonetimSokakKaldirTikla(sokakAdi) {
      sokakKaldirVeriden(sokakAdi);
      yonetimEkleKaldirEkraniCiz();
    }

    // ================= Bölge Ekle / Kaldır Yönetimi =================
    let bolgeYonetimAktif = false;
    let bolgeYonetimSeciliId = null;

    // Bölge yönetim panelini aç: bölge listesiyle başlar
    function bolgeYonetimAc() {
      bolgeYonetimAktif = true;
      bolgeYonetimSeciliId = null;

      document.getElementById('modalBaslik').textContent = '🗺️ Bölge Ekle / Kaldır';
      bolgeYonetimListeEkraniCiz();

      document.getElementById('modalOverlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    // 1. Adım: Bölge listesi + yeni bölge ekleme
    function bolgeYonetimListeEkraniCiz() {
      bolgeYonetimSeciliId = null;

      const body = document.getElementById('modalBody');
      body.innerHTML = '';

      const baslikEkle = document.createElement('div');
      baslikEkle.className = 'modal-alt-baslik';
      baslikEkle.textContent = 'Yeni Bölge Ekle';
      body.appendChild(baslikEkle);

      const inputRow = document.createElement('div');
      inputRow.className = 'yonetim-input-row';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'yonetim-input';
      input.id = 'bolgeAdInput';
      input.placeholder = 'Örn: Yeni Bölge';
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') bolgeEkleTikla();
      });
      inputRow.appendChild(input);

      const ekleBtn = document.createElement('button');
      ekleBtn.className = 'yonetim-ekle-btn';
      ekleBtn.textContent = '+ Ekle';
      ekleBtn.onclick = () => bolgeEkleTikla();
      inputRow.appendChild(ekleBtn);

      body.appendChild(inputRow);

      const not = document.createElement('div');
      not.className = 'yonetim-not';
      not.textContent = 'Bölgeyi ekledikten sonra üzerine tıklayıp mahalle ekleyebilirsiniz. Bir bölgeyi ✕ ile kaldırdığınızda, o bölge ve içindeki mahalleler listeden gizlenir.';
      body.appendChild(not);

      const baslikListe = document.createElement('div');
      baslikListe.className = 'modal-alt-baslik';
      baslikListe.textContent = `Bölgeler (${mahalleGruplari.length})`;
      body.appendChild(baslikListe);

      const grid = document.createElement('div');
      grid.className = 'modal-kisi-grid';

      mahalleGruplari.forEach((grup, idx) => {
        const kart = document.createElement('div');
        kart.className = 'modal-kisi-kart modal-kisi-kart-silinebilir';
        kart.innerHTML = `
          <div class="modal-kisi-ad">${grup.ad || 'Bölge ' + (idx + 1)}</div>
          <div class="modal-kisi-sayi">${grup.mahalleler.length} mahalle</div>
        `;
        kart.onclick = () => bolgeYonetimMahalleEkraniCiz(grup.id);

        const silBtn = document.createElement('button');
        silBtn.className = 'modal-kisi-sil';
        silBtn.textContent = '✕';
        silBtn.title = 'Bölgeyi kaldır';
        silBtn.onclick = (e) => {
          e.stopPropagation();
          bolgeKaldirVeriden(grup.id);
          bolgeYonetimListeEkraniCiz();
        };
        kart.appendChild(silBtn);

        grid.appendChild(kart);
      });

      body.appendChild(grid);
    }

    // Bölge Ekle butonuna tıklanınca çalışır
    function bolgeEkleTikla() {
      const input = document.getElementById('bolgeAdInput');
      const deger = input.value.trim();
      if (!deger) return;

      bolgeEkleVeriye(deger);
      bolgeYonetimListeEkraniCiz();

      const yeniInput = document.getElementById('bolgeAdInput');
      if (yeniInput) yeniInput.focus();
    }

    // 2. Adım: Seçilen bölgede mahalle ekle / kaldır ekranı
    function bolgeYonetimMahalleEkraniCiz(bolgeId) {
      bolgeYonetimSeciliId = bolgeId;
      const grup = mahalleGruplari.find(g => g.id === bolgeId);
      if (!grup) { bolgeYonetimListeEkraniCiz(); return; }
      const idx = mahalleGruplari.indexOf(grup);
      const bolgeAdi = grup.ad || 'Bölge ' + (idx + 1);

      const body = document.getElementById('modalBody');
      body.innerHTML = '';

      const geri = document.createElement('div');
      geri.className = 'modal-geri-satir';
      geri.textContent = '← Bölgelere dön';
      geri.onclick = () => bolgeYonetimListeEkraniCiz();
      body.appendChild(geri);

      const baslikEkle = document.createElement('div');
      baslikEkle.className = 'modal-alt-baslik';
      baslikEkle.textContent = `${bolgeAdi} — Mahalle Ekle`;
      body.appendChild(baslikEkle);

      const inputRow = document.createElement('div');
      inputRow.className = 'yonetim-input-row';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'yonetim-input';
      input.id = 'bolgeMahalleInput';
      input.placeholder = 'Örn: Yeni Mahalle';
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') bolgeyeMahalleEkleTikla();
      });
      inputRow.appendChild(input);

      const ekleBtn = document.createElement('button');
      ekleBtn.className = 'yonetim-ekle-btn';
      ekleBtn.textContent = '+ Ekle';
      ekleBtn.onclick = () => bolgeyeMahalleEkleTikla();
      inputRow.appendChild(ekleBtn);

      body.appendChild(inputRow);

      const uyariYeri = document.createElement('div');
      uyariYeri.id = 'bolgeMahalleUyari';
      body.appendChild(uyariYeri);

      const not = document.createElement('div');
      not.className = 'yonetim-not';
      not.textContent = `Eklenen mahalle "${bolgeAdi}" bölgesine kaydedilir.`;
      body.appendChild(not);

      const baslikListe = document.createElement('div');
      baslikListe.className = 'modal-alt-baslik';
      baslikListe.textContent = `Mahalleler (${grup.mahalleler.length})`;
      body.appendChild(baslikListe);

      if (grup.mahalleler.length === 0) {
        const bos = document.createElement('div');
        bos.className = 'yonetim-bos';
        bos.textContent = 'Bu bölgede henüz mahalle yok.';
        body.appendChild(bos);
      } else {
        const liste = document.createElement('div');
        liste.className = 'yonetim-sokak-liste';

        grup.mahalleler.forEach(m => {
          const satir = document.createElement('div');
          satir.className = 'yonetim-sokak-satir';

          const ad = document.createElement('div');
          ad.className = 'yonetim-sokak-ad';
          ad.textContent = m.label;
          satir.appendChild(ad);

          const silBtn = document.createElement('button');
          silBtn.className = 'yonetim-sil-btn';
          silBtn.textContent = '✕';
          silBtn.title = 'Mahalleyi kaldır';
          silBtn.onclick = () => {
            bolgedenMahalleKaldir(bolgeId, m.key, m.ozel);
            bolgeYonetimMahalleEkraniCiz(bolgeId);
          };
          satir.appendChild(silBtn);

          liste.appendChild(satir);
        });

        body.appendChild(liste);
      }
    }

    // Mahalle Ekle butonuna tıklanınca çalışır
    function bolgeyeMahalleEkleTikla() {
      const input = document.getElementById('bolgeMahalleInput');
      const deger = input.value.trim();
      const uyariYeri = document.getElementById('bolgeMahalleUyari');
      if (uyariYeri) uyariYeri.innerHTML = '';
      if (!deger) return;

      const sonuc = bolgeyeMahalleEkle(bolgeYonetimSeciliId, deger);
      if (!sonuc.basarili) {
        if (uyariYeri) {
          const uyari = document.createElement('div');
          uyari.className = 'yonetim-uyari';
          uyari.textContent = sonuc.mesaj;
          uyariYeri.appendChild(uyari);
        }
        return;
      }

      bolgeYonetimMahalleEkraniCiz(bolgeYonetimSeciliId);
      const yeniInput = document.getElementById('bolgeMahalleInput');
      if (yeniInput) yeniInput.focus();
    }

    // Modalı kapat
    function geriDon() {
      document.getElementById('modalOverlay').classList.add('hidden');
      document.body.style.overflow = '';
      document.querySelectorAll('.btn-mahalle').forEach(b => b.classList.remove('active'));

      if (yonetimAktif || bolgeYonetimAktif) {
        yonetimAktif = false;
        bolgeYonetimAktif = false;
        mahalleButonlariYenile();
      }
    }

    // Ana sayfadaki mahalle butonlarını (sokak sayıları/olası ekleme-kaldırmalar sonrası) yeniden oluşturur
    function mahalleButonlariYenile() {
      mahalleButonlariOlustur();
    }

    // Overlay dışına tıklayınca kapat
    function modalKapat(event) {
      if (event.target === document.getElementById('modalOverlay')) {
        geriDon();
      }
    }

    // Sayfa yüklendiğinde butonları ve son aramaları oluştur
    mahalleButonlariOlustur();
    sonAramalariGoster();
  </script>

  <script>
    // ================= Tema Seçimi (Açık / Koyu) =================
    (function() {
      var root = document.documentElement;
      var STORAGE_KEY = 'sokakMahalleTema';

      function uygulaTema(tema) {
        if (tema === 'light') {
          root.setAttribute('data-theme', 'light');
        } else {
          root.removeAttribute('data-theme');
        }
        var ikon = document.getElementById('themeIcon');
        var etiket = document.getElementById('themeLabel');
        if (ikon) ikon.textContent = tema === 'light' ? '🌙' : '☀️';
        if (etiket) etiket.textContent = tema === 'light' ? 'Koyu Tema' : 'Açık Tema';
      }

      var kayitliTema = null;
      try { kayitliTema = localStorage.getItem(STORAGE_KEY); } catch (e) {}

      if (!kayitliTema) {
        kayitliTema = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      uygulaTema(kayitliTema);

      window.temaDegistir = function() {
        var mevcut = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        var yeni = mevcut === 'light' ? 'dark' : 'light';
        uygulaTema(yeni);
        try { localStorage.setItem(STORAGE_KEY, yeni); } catch (e) {}
      };
    })();
  </script>
</body>
