<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sokak adını söyleyin veya yazın, mahallesini öğrenin">
  <meta name="theme-color" content="#0A0E17">
  <title>Sokak Mahalle Bulucu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #0A0E17;
      --bg-panel: #0F1523;
      --bg-panel-2: #131B2C;
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.14);
      --text-primary: #E7ECF5;
      --text-muted: #7C8797;
      --accent: #FF6B1A;
      --accent-dim: rgba(255,107,26,0.14);
      --cyan: #00E5C7;
      --cyan-dim: rgba(0,229,199,0.14);
      --success: #22D488;
      --success-dim: rgba(34,212,136,0.12);
      --error: #FF4D6D;
      --error-dim: rgba(255,77,109,0.12);
      --blue: #3B9EFF;
      --blue-dim: rgba(59,158,255,0.12);
      --yellow: #FACC15;
      --yellow-dim: rgba(250,204,21,0.12);
      --gray: #8B96A8;
      --gray-dim: rgba(139,150,168,0.12);
      --white-grp: #CBD4E1;
      --white-dim: rgba(203,212,225,0.1);
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --display: 'Space Grotesk', sans-serif;
      --body: 'Inter', -apple-system, sans-serif;
    }

    /* ================= Giriş Animasyonu: Köpek + Ekran Kırılması ================= */
    .intro-anim {
      position: fixed;
      inset: 0;
      z-index: 3000;
      pointer-events: none;
      overflow: hidden;
    }

    .intro-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
    }

    .intro-anim.ia-impact .intro-flash {
      animation: iaFlash 0.5s ease-out forwards;
    }

    @keyframes iaFlash {
      0% { opacity: 0; }
      14% { opacity: 0.85; }
      100% { opacity: 0; }
    }

    .intro-cracks {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vmax;
      height: 100vmax;
      transform: translate(-50%, -50%);
      opacity: 0;
    }

    .intro-cracks .crack-glow polyline {
      fill: none;
      stroke: #fff;
      stroke-width: 0.55;
      stroke-linejoin: round;
      stroke-linecap: round;
      filter: drop-shadow(0 0 1.2px rgba(255,255,255,0.9));
      opacity: 0.92;
    }

    .intro-anim.ia-impact .intro-cracks {
      animation: iaCrackIn 0.16s ease-out forwards;
    }

    .intro-anim.ia-burst .intro-cracks {
      animation: iaCrackOut 0.5s ease-in forwards;
    }

    @keyframes iaCrackIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes iaCrackOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .intro-dog {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(34vw, 320px);
      height: auto;
      transform: translate(calc(-50% - 150vw), -38%) rotate(-8deg) scale(0.92);
      filter: drop-shadow(0 16px 26px rgba(0,0,0,0.55));
      will-change: transform, opacity;
    }

    .intro-anim.ia-run .intro-dog {
      animation: iaRun 0.95s cubic-bezier(.2,.7,.25,1) forwards;
    }

    .intro-anim.ia-burst .intro-dog {
      animation: iaBurst 0.5s cubic-bezier(.55,0,1,0.45) forwards;
    }

    @keyframes iaRun {
      0%   { transform: translate(calc(-50% - 150vw), -38%) rotate(-8deg) scale(0.92); }
      18%  { transform: translate(calc(-50% - 96vw),  -57%) rotate(7deg)  scale(1.03); }
      36%  { transform: translate(calc(-50% - 54vw),  -37%) rotate(-6deg) scale(0.96); }
      54%  { transform: translate(calc(-50% - 24vw),  -56%) rotate(5deg)  scale(1.04); }
      72%  { transform: translate(calc(-50% - 7vw),   -40%) rotate(-3deg) scale(0.98); }
      88%  { transform: translate(calc(-50% - 1vw),   -52%) rotate(1deg)  scale(1.02); }
      100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    }

    @keyframes iaBurst {
      0%   { transform: translate(-50%, -50%) scale(1);    opacity: 1; }
      25%  { transform: translate(-50%, -50%) scale(1.18); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(5.5);  opacity: 0; }
    }

    @keyframes iaShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 3px); }
      40% { transform: translate(5px, -4px); }
      60% { transform: translate(-4px, -3px); }
      80% { transform: translate(6px, 2px); }
    }

    body.ia-shake { animation: iaShake 0.32s linear; }

    @media (max-width: 640px) {
      .intro-dog { width: min(52vw, 240px); }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--body);
      background:
        radial-gradient(circle at 15% 0%, rgba(255,107,26,0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 100%, rgba(0,229,199,0.06) 0%, transparent 45%),
        var(--bg-deep);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      z-index: 0;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 20%, black 40%, transparent 100%);
    }

    .container {
      max-width: 960px;
      margin: 1.5rem auto;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      padding-left: 0.15rem;
    }

    .eyebrow .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .header {
      background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
      border: 1px solid var(--line);
      border-bottom: none;
      border-radius: 1rem 1rem 0 0;
      padding: 0.75rem 2rem 0.75rem;
      position: relative;
      overflow: hidden;
      text-align: left;
    }

    .header::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--cyan));
    }

    h1 {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .main {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-top: none;
      border-bottom: none;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: flex-end;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .field {
      flex: 1 1 340px;
      position: relative;
    }

    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 0.4rem);
      left: 0;
      right: 0;
      background: var(--bg-panel-2);
      border: 1px solid var(--line-strong);
      border-radius: 0.6rem;
      max-height: 280px;
      overflow-y: auto;
      z-index: 50;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    }

    .autocomplete-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 1rem;
      font-family: var(--body);
      font-size: 0.9rem;
      color: var(--text-primary);
      cursor: pointer;
      border-bottom: 1px solid var(--line);
      transition: background 0.12s;
    }

    .autocomplete-item:last-child { border-bottom: none; }

    .autocomplete-item:hover,
    .autocomplete-item.active {
      background: var(--accent-dim);
    }

    .autocomplete-ad mark {
      background: transparent;
      color: var(--accent);
      font-weight: 700;
    }

    .autocomplete-mahalle {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    label {
      display: block;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    input {
      width: 100%;
      padding: 0.85rem 1rem;
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--text-primary);
      border: 1px solid var(--line-strong);
      border-radius: 0.6rem;
      background: rgba(255,255,255,0.02);
      transition: all 0.2s;
    }

    input::placeholder { color: #4A5468; }

    input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255,107,26,0.04);
      box-shadow: 0 0 0 3px rgba(255,107,26,0.12);
    }

    .buttons {
      display: flex;
      gap: 0.6rem;
      flex: 0 0 auto;
    }

    @media (max-width: 640px) {
      .main { flex-direction: column; align-items: stretch; }
      .field { flex: 1 1 auto; }
      .buttons { flex-direction: row; }
    }

    button {
      padding: 0.8rem 1.4rem;
      border: 1px solid transparent;
      border-radius: 0.6rem;
      font-family: var(--body);
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-search {
      flex: 1;
      background: var(--text-primary);
      color: var(--bg-deep);
    }

    .btn-search:hover {
      background: #fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(255,255,255,0.15);
    }

    .btn-voice {
      background: var(--accent);
      color: #fff;
      padding: 0.8rem 1.1rem;
    }

    .btn-voice:hover {
      background: #FF7A33;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(255,107,26,0.35);
    }

    .btn-voice.listening {
      animation: pulse 1.3s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,26,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(255,107,26,0); }
    }

    .btn-clear {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--line-strong);
      padding: 0.8rem 1.1rem;
    }

    .btn-clear:hover {
      border-color: var(--text-muted);
      color: var(--text-primary);
    }

    .result {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 0 0 1rem 1rem;
      padding: 1.75rem;
      border-top: none;
    }

    .result-box {
      border-radius: 0.6rem;
      padding: 1.25rem 1.4rem;
      border: 1px solid;
      background: rgba(255,255,255,0.015);
    }

    .result-success { border-color: rgba(34,212,136,0.35); background: var(--success-dim); }
    .result-error { border-color: rgba(255,77,109,0.35); background: var(--error-dim); }
    .result-warning { border-color: rgba(255,107,26,0.35); background: var(--accent-dim); }
    .result-listening { border-color: rgba(0,229,199,0.35); background: var(--cyan-dim); }

    .result-title {
      font-family: var(--mono);
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      font-weight: 600;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
    }

    .success-title { color: var(--success); }
    .error-title { color: var(--error); }
    .warning-title { color: var(--accent); }
    .listening-title { color: var(--cyan); }

    .sokak-name {
      font-family: var(--mono);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .mahalle-name {
      font-family: var(--display);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 0.35rem;
    }

    .sonaramalar-wrap {
      max-width: 960px;
      margin: 1.25rem auto 0;
    }

    .sonaramalar-section {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
    }

    .sonaramalar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .sonaramalar-title {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cyan);
    }

    .btn-sonaramalar-temizle {
      background: transparent;
      border: 1px solid var(--line-strong);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      border-radius: 2rem;
    }

    .btn-sonaramalar-temizle:hover {
      border-color: var(--error);
      color: var(--error);
    }

    .sonaramalar-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .chip-sonarama {
      background: rgba(0,229,199,0.06);
      border: 1px solid rgba(0,229,199,0.3);
      border-radius: 2rem;
      padding: 0.5rem 1rem;
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--cyan);
      cursor: pointer;
      transition: all 0.2s;
      text-transform: capitalize;
    }

    .chip-sonarama:hover {
      background: var(--cyan);
      border-color: var(--cyan);
      color: var(--bg-deep);
    }

    .chip-sonarama .chip-mahalle {
      font-family: var(--mono);
      font-size: 0.7rem;
      opacity: 0.75;
      margin-left: 0.35rem;
      text-transform: none;
    }

    .mahalle-wrap {
      max-width: 960px;
      margin: 1.25rem auto 0;
    }

    .mahalle-section {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 1.75rem 2rem;
    }

    .mahalle-section-title {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .btn-yonetim-ac {
      font-family: var(--body);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: normal;
      text-transform: none;
      color: var(--cyan);
      background: var(--cyan-dim);
      border: 1px solid rgba(0,229,199,0.35);
      border-radius: 2rem;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-yonetim-ac:hover {
      background: var(--cyan);
      color: #06231a;
      border-color: var(--cyan);
    }

    .mahalle-groups {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.1rem 1.4rem;
    }

    @media (max-width: 760px) {
      .mahalle-groups { grid-template-columns: 1fr; }
    }

    .grup-card {
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      padding: 1rem 1.1rem;
      background: rgba(255,255,255,0.012);
      position: relative;
      overflow: hidden;
    }

    .grup-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--grup-renk, var(--accent));
      opacity: 0.7;
    }

    .grup-card-title {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .grup-card-title .grup-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--grup-renk, var(--accent));
      box-shadow: 0 0 6px var(--grup-renk, var(--accent));
      flex-shrink: 0;
    }

    .mahalle-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .btn-mahalle {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line-strong);
      border-radius: 2rem;
      padding: 0.5rem 1rem;
      font-family: var(--body);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-mahalle:not([class*="btn-mahalle-"]):hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-mahalle.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Grup renkleri */
    .btn-mahalle-gri { border-color: rgba(139,150,168,0.4); color: var(--gray); }
    .btn-mahalle-gri:hover, .btn-mahalle-gri.active { background: var(--gray); border-color: var(--gray); color: #0A0E17; }

    .btn-mahalle-yesil { border-color: rgba(34,212,136,0.4); color: var(--success); }
    .btn-mahalle-yesil:hover, .btn-mahalle-yesil.active { background: var(--success); border-color: var(--success); color: #0A0E17; }

    .btn-mahalle-kirmizi { border-color: rgba(255,77,109,0.4); color: var(--error); }
    .btn-mahalle-kirmizi:hover, .btn-mahalle-kirmizi.active { background: var(--error); border-color: var(--error); color: #0A0E17; }

    .btn-mahalle-mavi { border-color: rgba(59,158,255,0.4); color: var(--blue); }
    .btn-mahalle-mavi:hover, .btn-mahalle-mavi.active { background: var(--blue); border-color: var(--blue); color: #0A0E17; }

    .btn-mahalle-sari { border-color: rgba(250,204,21,0.4); color: var(--yellow); }
    .btn-mahalle-sari:hover, .btn-mahalle-sari.active { background: var(--yellow); border-color: var(--yellow); color: #0A0E17; }

    .btn-mahalle-beyaz { border-color: rgba(203,212,225,0.35); color: var(--white-grp); background: rgba(255,255,255,0.03); }
    .btn-mahalle-beyaz:hover, .btn-mahalle-beyaz.active { background: var(--white-grp); border-color: var(--white-grp); color: #0A0E17; }

    .btn-mahalle-turuncu { border-color: rgba(255,107,26,0.4); color: var(--accent); }
    .btn-mahalle-turuncu:hover, .btn-mahalle-turuncu.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Grup ayırıcı */
    .grup-ayirici {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin: 0.5rem 0;
    }

    .mahalle-detail {
      margin-top: 1.5rem;
      border-top: 1px solid var(--line);
      padding-top: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mahalle-detail-title {
      font-family: var(--display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .btn-geri {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0;
    }

    .btn-geri:hover { color: var(--accent); }

    .sokak-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      margin-bottom: 0.4rem;
      font-family: var(--mono);
      font-weight: 500;
      color: var(--text-primary);
      text-transform: capitalize;
      transition: all 0.2s;
    }

    .sokak-item:hover {
      border-color: var(--accent);
      background: rgba(255,107,26,0.04);
      transform: translateX(4px);
      color: var(--accent);
    }

    .logo-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      text-align: right;
      z-index: 1000;
      opacity: 0.9;
    }

    .logo-trendyol {
      font-family: var(--display);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .logo-trendyol-main {
      color: var(--text-primary);
      font-size: 24px;
      letter-spacing: -0.5px;
    }

    .logo-trendyol-express {
      color: var(--accent);
      font-size: 20px;
      letter-spacing: -0.3px;
    }

    .logo-subtitle {
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5,7,12,0.72);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }

    .modal-overlay.hidden { display: none; }

    .modal-box {
      background: var(--bg-panel);
      border: 1px solid var(--line-strong);
      border-radius: 1rem;
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .modal-header {
      background: var(--bg-panel-2);
      border-bottom: 1px solid var(--line);
      color: var(--text-primary);
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .modal-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--cyan));
    }

    .modal-header-title {
      font-family: var(--display);
      font-size: 1.15rem;
      font-weight: 700;
    }

    .modal-close {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line-strong);
      color: var(--text-primary);
      font-size: 1.1rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }

    .modal-close:hover { background: rgba(255,107,26,0.15); border-color: var(--accent); }

    .modal-body {
      overflow-y: auto;
      padding: 1.25rem;
    }

    .modal-sokak-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.5rem;
    }

    @media (max-width: 560px) {
      .modal-sokak-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 380px) {
      .modal-sokak-grid { grid-template-columns: 1fr; }
    }

    .modal-sokak-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      padding: 0.55rem 0.4rem;
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.72rem;
      line-height: 1.25;
      color: var(--text-primary);
      text-transform: capitalize;
      text-align: center;
      word-break: break-word;
      transition: all 0.2s;
    }

    .modal-sokak-item:hover {
      border-color: var(--accent);
      background: rgba(255,107,26,0.06);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .modal-alt-baslik {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--accent);
      margin: 1.1rem 0 0.6rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--line);
    }

    .modal-alt-baslik:first-child {
      margin-top: 0;
    }

    .modal-kisi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    @media (max-width: 480px) {
      .modal-kisi-grid { grid-template-columns: 1fr; }
    }

    .modal-kisi-kart {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line-strong);
      border-radius: 0.75rem;
      padding: 1rem 0.75rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-kisi-kart:hover {
      border-color: var(--accent);
      background: rgba(255,107,26,0.06);
      transform: translateY(-2px);
    }

    .modal-kisi-ad {
      font-family: var(--display);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-primary);
      margin-bottom: 0.35rem;
    }

    .modal-kisi-sayi {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .modal-geri-satir {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      margin-bottom: 1rem;
      display: inline-block;
      transition: color 0.2s;
    }

    .modal-geri-satir:hover {
      color: var(--accent);
    }

    .hidden { display: none; }

    .yonetim-input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .yonetim-input {
      flex: 1;
      padding: 0.7rem 0.9rem;
      font-family: var(--mono);
      font-size: 0.88rem;
      color: var(--text-primary);
      border: 1px solid var(--line-strong);
      border-radius: 0.5rem;
      background: rgba(255,255,255,0.02);
      min-width: 0;
    }

    .yonetim-input::placeholder { color: #4A5468; }

    .yonetim-input:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0,229,199,0.12);
    }

    .yonetim-ekle-btn {
      background: var(--success);
      color: #06231a;
      border: none;
      border-radius: 0.5rem;
      padding: 0 1.1rem;
      font-family: var(--body);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .yonetim-ekle-btn:hover { background: #3EE79E; }

    .yonetim-not {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 1.1rem;
    }

    .yonetim-sokak-liste {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 280px;
      overflow-y: auto;
    }

    .yonetim-sokak-satir {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      padding: 0.55rem 0.5rem 0.55rem 0.8rem;
    }

    .yonetim-sokak-ad {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-primary);
      text-transform: capitalize;
      word-break: break-word;
    }

    .yonetim-sil-btn {
      background: var(--error-dim);
      color: var(--error);
      border: 1px solid rgba(255,77,109,0.35);
      border-radius: 0.4rem;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1;
      transition: all 0.2s;
    }

    .yonetim-sil-btn:hover { background: var(--error); color: #fff; }

    .yonetim-bos {
      color: var(--text-muted);
      font-size: 0.82rem;
      text-align: center;
      padding: 1.25rem 0;
      font-family: var(--mono);
    }

    @media (max-width: 480px) {
      .logo-container { display: none; }
    }
  </style>
</head>

    // --- Esnek sokak eşleştirme ---
    // "Suna" da yazılsa "Suna Sokak" da yazılsa, veritabanında hangisi varsa onu bulur.
    function normalizeSokakAdi(str) {
      return str
        .toLocaleLowerCase('tr')
        .replace(/[.,]/g, '')
        .replace(/\b(sokak|sokağı|sk|caddesi|cadde|cad|bulvarı|bulvari|meydanı|meydani)\b/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // --- Kullanıcı tarafından eklenen/kaldırılan sokaklar (localStorage) ---
    const SOKAK_EKLENEN_ANAHTAR = 'sokakBulucu_eklenenSokaklar';
    const SOKAK_SILINEN_ANAHTAR = 'sokakBulucu_silinenSokaklar';

    function eklenenSokaklariGetir() {
      try {
        const veri = localStorage.getItem(SOKAK_EKLENEN_ANAHTAR);
        return veri ? JSON.parse(veri) : {};
      } catch (e) { return {}; }
    }

    function eklenenSokaklariKaydet(obj) {
      try { localStorage.setItem(SOKAK_EKLENEN_ANAHTAR, JSON.stringify(obj)); }
      catch (e) { /* depolama kullanılamıyorsa sessizce geç */ }
    }

    function silinenSokaklariGetir() {
      try {
        const veri = localStorage.getItem(SOKAK_SILINEN_ANAHTAR);
        return veri ? JSON.parse(veri) : [];
      } catch (e) { return []; }
    }

    function silinenSokaklariKaydet(liste) {
      try { localStorage.setItem(SOKAK_SILINEN_ANAHTAR, JSON.stringify(liste)); }
      catch (e) { /* depolama kullanılamıyorsa sessizce geç */ }
    }

    // Etkin sokak listesi: temel veri + kullanıcı eklemeleri - kullanıcı silmeleri
    let sokaklar = {};
    let sokaklarNormalize = {};

    function sokaklariYenidenOlustur() {
      Object.keys(sokaklar).forEach(k => delete sokaklar[k]);
      Object.assign(sokaklar, sokaklarTemel);

      const silinen = silinenSokaklariGetir();
      silinen.forEach(k => delete sokaklar[k]);

      const eklenen = eklenenSokaklariGetir();
      Object.assign(sokaklar, eklenen);

      Object.keys(sokaklarNormalize).forEach(k => delete sokaklarNormalize[k]);
      Object.keys(sokaklar).forEach(key => {
        const norm = normalizeSokakAdi(key);
        if (!(norm in sokaklarNormalize)) {
          sokaklarNormalize[norm] = key;
        }
      });
    }

    sokaklariYenidenOlustur();

    // Yeni bir sokak ekler (varsa üzerine yazar) ve verileri kalıcı hale getirir
    function sokakEkleVeriye(sokakAdiHam, mahalleKey) {
      const sokakAdi = sokakAdiHam.toLocaleLowerCase('tr').trim();
      if (!sokakAdi) return false;

      const silinen = silinenSokaklariGetir().filter(k => k !== sokakAdi);
      silinenSokaklariKaydet(silinen);

      const eklenen = eklenenSokaklariGetir();
      eklenen[sokakAdi] = mahalleKey;
      eklenenSokaklariKaydet(eklenen);

      sokaklariYenidenOlustur();
      return true;
    }

    // Bir sokağı veriden kaldırır ve kalıcı hale getirir
    function sokakKaldirVeriden(sokakAdi) {
      const eklenen = eklenenSokaklariGetir();
      if (sokakAdi in eklenen) {
        delete eklenen[sokakAdi];
        eklenenSokaklariKaydet(eklenen);
      } else {
        const silinen = silinenSokaklariGetir();
        if (!silinen.includes(sokakAdi)) {
          silinen.push(sokakAdi);
          silinenSokaklariKaydet(silinen);
        }
      }
      sokaklariYenidenOlustur();
    }

    // Girilen/söylenen sokak adına göre mahalleyi bulur (önce tam eşleşme, sonra esnek eşleşme)
    function sokakBul(girilenAd) {
      const aranan = girilenAd.toLocaleLowerCase('tr').trim();

      if (sokaklar[aranan]) return sokaklar[aranan];

      const normAranan = normalizeSokakAdi(girilenAd);
      const eslesenKey = sokaklarNormalize[normAranan];
      if (eslesenKey) return sokaklar[eslesenKey];

      return null;
    }

      'Körfez 1': 'Kenan Oruç',
      'Tepecik 1': 'Zeki Kanpara',
      'Körfez 2': 'Mustafa Tayyip',
      'Emekevler 1': 'Eyüp Gençtürk',
      'Sarımeşe 1': 'Şaban Öz',
      'Ömerağa 1': 'Bilal Uçar'
    };

    function sorumluGetir(mahalle) {
      return mahalleSorumlulari[mahalle] || mahalle;
    }

    // Sokak listesini Türkçe alfabetik sıraya göre diz
    function sokaklariSirala(liste) {
      return [...liste].sort((a, b) => a.localeCompare(b, 'tr'));
    }

    // --- Son Aranananlar ---
    const SON_ARAMALAR_ANAHTAR = 'sokakBulucu_sonAramalar';
    const SON_ARAMALAR_MAKS = 10;

    function sonAramalariGetir() {
      try {
        const veri = localStorage.getItem(SON_ARAMALAR_ANAHTAR);
        return veri ? JSON.parse(veri) : [];
      } catch (e) {
        return [];
      }
    }

    function sonAramaEkle(sokakAdi, mahalle) {
      let liste = sonAramalariGetir();
      // Aynı sokak zaten listede varsa çıkar, en başa tekrar eklenecek
      liste = liste.filter(item => item.sokak.toLocaleLowerCase('tr') !== sokakAdi.toLocaleLowerCase('tr'));
      liste.unshift({ sokak: sokakAdi, mahalle: mahalle });
      liste = liste.slice(0, SON_ARAMALAR_MAKS);
      try {
        localStorage.setItem(SON_ARAMALAR_ANAHTAR, JSON.stringify(liste));
      } catch (e) { /* depolama kullanılamıyorsa sessizce geç */ }
      sonAramalariGoster();
    }

    function sonAramalariTemizle() {
      try {
        localStorage.removeItem(SON_ARAMALAR_ANAHTAR);
      } catch (e) { /* yoksay */ }
      sonAramalariGoster();
    }

    function sonAramalariGoster() {
      const liste = sonAramalariGetir();
      const wrap = document.getElementById('sonAramalarWrap');
      const chipsDiv = document.getElementById('sonAramalarChips');

      if (!liste.length) {
        wrap.classList.add('hidden');
        return;
      }

      wrap.classList.remove('hidden');
      chipsDiv.innerHTML = '';

      liste.forEach(item => {
        const chip = document.createElement('button');
        chip.className = 'chip-sonarama';
        chip.innerHTML = `${item.sokak}<span class="chip-mahalle">${item.mahalle}</span>`;
        chip.onclick = () => {
          document.getElementById('sokakInput').value = item.sokak;
          ara();
        };
        chipsDiv.appendChild(chip);
      });
    }

    let dinliyor = false;

    // ================= Autocomplete (öneri açılır menüsü) =================
    let acOneriler = [];
    let acSeciliIndex = -1;

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function capitalizeSokak(str) {
      return str.replace(/\S+/g, kelime => kelime.charAt(0).toLocaleUpperCase('tr') + kelime.slice(1));
    }

    // Eşleşen kısmı vurgulayarak HTML üretir
    function vurguluMetin(gosterimAdi, qLower) {
      const lower = gosterimAdi.toLocaleLowerCase('tr');
      const idx = qLower ? lower.indexOf(qLower) : -1;
      if (idx === -1) return escapeHtml(gosterimAdi);
      return escapeHtml(gosterimAdi.slice(0, idx)) +
        '<mark>' + escapeHtml(gosterimAdi.slice(idx, idx + qLower.length)) + '</mark>' +
        escapeHtml(gosterimAdi.slice(idx + qLower.length));
    }

    // Girilen metne göre öneri listesi çıkarır: önce birebir içerenler, sonra ek/kelime farkı gözetmeksizin eşleşenler
    function sokakOneriListesi(query) {
      const qLower = query.toLocaleLowerCase('tr').trim();
      if (!qLower) return [];
      const qNorm = normalizeSokakAdi(query);
      const tumSokaklar = Object.keys(sokaklar);

      const duzEslesen = tumSokaklar
        .filter(k => k.includes(qLower))
        .sort((a, b) => a.localeCompare(b, 'tr'));

      const normEslesen = tumSokaklar
        .filter(k => !k.includes(qLower) && normalizeSokakAdi(k).includes(qNorm))
        .sort((a, b) => a.localeCompare(b, 'tr'));

      return [...duzEslesen, ...normEslesen].slice(0, 8);
    }

    function autocompleteGoster(query) {
      const dropdown = document.getElementById('autocompleteDropdown');
      acOneriler = sokakOneriListesi(query);
      acSeciliIndex = -1;

      if (acOneriler.length === 0) {
        autocompleteGizle();
        return;
      }

      const qLower = query.toLocaleLowerCase('tr').trim();
      dropdown.innerHTML = acOneriler.map((key, i) => {
        const gosterimAdi = capitalizeSokak(key);
        return `
          <div class="autocomplete-item" data-idx="${i}" onmousedown="autocompleteSec(${i})">
            <span class="autocomplete-ad">${vurguluMetin(gosterimAdi, qLower)}</span>
            <span class="autocomplete-mahalle">${sokaklar[key]}</span>
          </div>
        `;
      }).join('');
      dropdown.classList.remove('hidden');
    }

    function autocompleteGizle() {
      const dropdown = document.getElementById('autocompleteDropdown');
      dropdown.classList.add('hidden');
      dropdown.innerHTML = '';
      acOneriler = [];
      acSeciliIndex = -1;
    }

    function autocompleteVurguYenile() {
      const dropdown = document.getElementById('autocompleteDropdown');
      Array.from(dropdown.children).forEach((el, i) => {
        el.classList.toggle('active', i === acSeciliIndex);
      });
      const aktifEl = dropdown.children[acSeciliIndex];
      if (aktifEl) aktifEl.scrollIntoView({ block: 'nearest' });
    }

    // Öneriye tıklanınca/seçilince: input'a yaz ve ara
    function autocompleteSec(i) {
      const key = acOneriler[i];
      if (!key) return;
      document.getElementById('sokakInput').value = capitalizeSokak(key);
      autocompleteGizle();
      ara();
    }

    const sokakInputEl = document.getElementById('sokakInput');

    sokakInputEl.addEventListener('input', function(e) {
      autocompleteGoster(e.target.value);
    });

    sokakInputEl.addEventListener('focus', function(e) {
      if (e.target.value.trim()) autocompleteGoster(e.target.value);
    });

    // Dropdown dışına tıklanınca kapat (öge tıklaması onmousedown ile önce yakalanıyor)
    sokakInputEl.addEventListener('blur', function() {
      setTimeout(autocompleteGizle, 150);
    });

    // Klavye: yukarı/aşağı ile öneriler arasında gezinme, Enter ile seçim/arama, Escape ile kapatma
    sokakInputEl.addEventListener('keydown', function(e) {
      const dropdown = document.getElementById('autocompleteDropdown');
      const dropdownAcik = !dropdown.classList.contains('hidden') && acOneriler.length > 0;

      if (e.key === 'ArrowDown') {
        if (dropdownAcik) {
          e.preventDefault();
          acSeciliIndex = (acSeciliIndex + 1) % acOneriler.length;
          autocompleteVurguYenile();
        }
      } else if (e.key === 'ArrowUp') {
        if (dropdownAcik) {
          e.preventDefault();
          acSeciliIndex = (acSeciliIndex - 1 + acOneriler.length) % acOneriler.length;
          autocompleteVurguYenile();
        }
      } else if (e.key === 'Enter') {
        if (dropdownAcik && acSeciliIndex >= 0) {
          e.preventDefault();
          autocompleteSec(acSeciliIndex);
        } else {
          ara();
          autocompleteGizle();
        }
      } else if (e.key === 'Escape') {
        autocompleteGizle();
      }
    });

    // Arama fonksiyonu
    function ara() {
      const input = document.getElementById('sokakInput').value;
      const aranan = input.toLowerCase().trim();
      const resultDiv = document.getElementById('result');

      if (!aranan) {
        gosterSonuc('error', '❌ Uyarı', 'Lütfen bir sokak adı girin!');
        return;
      }

      const mahalle = sokakBul(input);

      if (mahalle) {
        gosterSonuc('success', '✅ Bulundu!', 
          `<div class="sokak-name">${input}</div><div class="mahalle-name">${mahalle}</div>`);
        sesliSoyle(sorumluGetir(mahalle));
        sonAramaEkle(input, mahalle);
      } else {
        gosterSonuc('warning', '⚠️ Bulunamadı', 'Bu sokak veritabanında bulunamadı.');
      }
    }

    // Sesli konuşma fonksiyonu
    function sesliSoyle(metin) {
      // Önceki konuşmaları iptal et
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(metin);
      utterance.lang = 'tr-TR';
      // "Ali Durmuş" ismi daha net anlaşılsın diye biraz daha yavaş okunur
      utterance.rate = (metin.trim() === 'Ali Durmuş') ? 0.8 : 1.2;
      utterance.pitch = 1;
      utterance.volume = 1;
      
      // Hemen konuş
      window.speechSynthesis.speak(utterance);
    }

    // Sesli arama
    function sesliAra() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        gosterSonuc('error', '❌ Uyarı', 'Tarayıcınız ses tanımayı desteklemiyor. Lütfen Chrome veya Edge kullanın.');
        sesliSoyle('Tarayıcınız ses tanımayı desteklemiyor.');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = false;
      recognition.interimResults = false;

      const voiceBtn = document.getElementById('voiceBtn');

      recognition.onstart = () => {
        dinliyor = true;
        voiceBtn.classList.add('listening');
        voiceBtn.textContent = '🔴 Dinliyor...';
        gosterSonuc('listening', '🎤 Dinliyorum', 'Sokak adını söyleyin...');
      };

      recognition.onresult = (event) => {
        const sesliBilgi = event.results[0][0].transcript;
        document.getElementById('sokakInput').value = sesliBilgi;
        
        const mahalle = sokakBul(sesliBilgi);

        if (mahalle) {
          gosterSonuc('success', '✅ Bulundu!', 
            `<div class="sokak-name">${sesliBilgi}</div><div class="mahalle-name">${mahalle}</div>`);
          sesliSoyle(sorumluGetir(mahalle));
          sonAramaEkle(sesliBilgi, mahalle);
        } else {
          gosterSonuc('warning', '⚠️ Bulunamadı', 'Bu sokak veritabanında bulunamadı.');
          sesliSoyle('Bulunamadı');
        }
      };

      recognition.onerror = () => {
        gosterSonuc('error', '❌ Hata', 'Ses tanıma hatası. Lütfen tekrar deneyin.');
        sesliSoyle('Ses tanıma hatası. Lütfen tekrar deneyin.');
      };

      recognition.onend = () => {
        dinliyor = false;
        voiceBtn.classList.remove('listening');
        voiceBtn.textContent = '🎤';
      };

      recognition.start();
    }

    // Temizle
    function temizle() {
      document.getElementById('sokakInput').value = '';
      document.getElementById('result').classList.add('hidden');
      autocompleteGizle();
    }

    // Sonuç göster
    function gosterSonuc(tip, baslik, mesaj) {
      const resultDiv = document.getElementById('result');
      const tipClass = `result-${tip}`;
      const titleClass = `${tip}-title`;

      resultDiv.innerHTML = `
        <div class="result-box ${tipClass}">
          <div class="result-title ${titleClass}">${baslik}</div>
          <div>${mesaj}</div>
        </div>
      `;
      resultDiv.classList.remove('hidden');
    }

    // Mahalleleri grupla
    function mahalleSokakMap() {
      const map = {};
      Object.entries(sokaklar).forEach(([sokak, mahalle]) => {
        if (!map[mahalle]) map[mahalle] = [];
        map[mahalle].push(sokak);
      });
      return map;
    }

    // Mahalle grupları
    const mahalleGruplari = [
      {
        renk: 'mavi',
        mahalleler: [
          { label: 'FSM1', key: 'FSM' },
          { label: 'FSM2', key: 'FSM2' },
          { label: 'FSM3', key: 'İdris Maden' },
          { label: 'FSM4', key: 'Ali Durmuş' },
          'Köseköy 1', 'Sarımeşe 1', 'İstasyon 1'
        ]
      },
      {
        renk: 'gri',
        mahalleler: ['Arslanbey 1', 'Arslanbey 2', 'Balaban', 'Derbent', 'Maşukiye', 'Suadiye']
      },
      {
        renk: 'yesil',
        mahalleler: ['Ataevler 1', 'Ataevler 2', 'Ataevler 3', 'Emekevler 1', 'Uzunçiftlik 1']
      },
      {
        renk: 'kirmizi',
        mahalleler: ['Dumlupınar 1', 'Dumlupınar 2', 'Ertuğrul 1', 'Eşme 1']
      },
      {
        renk: 'sari',
        mahalleler: ['Karabaş 1', 'Tepecik 1', 'Ömerağa 1']
      },
      {
        renk: 'beyaz',
        mahalleler: ['Körfez 1', 'Körfez 2']
      }
    ];

    // Grup renklerinin CSS değişken karşılıkları
    const grupRenkDegiskeni = {
      gri: 'var(--gray)',
      yesil: 'var(--success)',
      kirmizi: 'var(--error)',
      mavi: 'var(--blue)',
      sari: 'var(--yellow)',
      beyaz: 'var(--white-grp)'
    };

    // Mahalle butonlarını gruplu, kart bazlı oluştur (3 üstte / 3 altta ızgara)
    function mahalleButonlariOlustur() {
      const map = mahalleSokakMap();
      const container = document.getElementById('mahalleButtons');
      container.innerHTML = '';

      mahalleGruplari.forEach((grup, idx) => {
        const card = document.createElement('div');
        card.className = 'grup-card';
        card.style.setProperty('--grup-renk', grupRenkDegiskeni[grup.renk] || 'var(--accent)');

        const title = document.createElement('div');
        title.className = 'grup-card-title';
        title.innerHTML = `<span class="grup-dot"></span>Bölge ${idx + 1}`;
        card.appendChild(title);

        const btnWrap = document.createElement('div');
        btnWrap.className = 'mahalle-buttons';

        grup.mahalleler.forEach(item => {
          const key = typeof item === 'string' ? item : item.key;
          const label = typeof item === 'string' ? item : item.label;
          if (!map[key]) return;
          const btn = document.createElement('button');
          btn.className = 'btn-mahalle btn-mahalle-' + grup.renk;
          btn.textContent = label;
          btn.onclick = () => mahalleAc(key, btn, label);
          btnWrap.appendChild(btn);
        });

        card.appendChild(btnWrap);
        container.appendChild(card);
      });
    }

    // Mahalle detayını modal olarak aç
    function mahalleAc(mahalle, btnEl, gosterilecekAd) {
      document.querySelectorAll('.btn-mahalle').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');

      const map = mahalleSokakMap();
      const body = document.getElementById('modalBody');
      body.innerHTML = '';
      const sokakListesi = map[mahalle] || [];

      let baslik;
      let sesMetni;
      if (gosterilecekAd && gosterilecekAd !== mahalle) {
        // Etiket, gerçek anahtardan farklı (ör. FSM1/FSM3/FSM4): sadece etiketi göster/söyle
        baslik = gosterilecekAd;
        sesMetni = gosterilecekAd;
      } else {
        const sorumlu = mahalleSorumlulari[mahalle];
        baslik = sorumlu ? mahalle + ' - ' + sorumlu : mahalle;
        sesMetni = sorumluGetir(mahalle);
      }

      document.getElementById('modalBaslik').textContent = '📍 ' + baslik;
      sesliSoyle(sesMetni);
      const grid = document.createElement('div');
      grid.className = 'modal-sokak-grid';
      sokaklariSirala(sokakListesi).forEach(sokak => {
        const div = document.createElement('div');
        div.className = 'modal-sokak-item';
        div.textContent = sokak;
        grid.appendChild(div);
      });
      body.appendChild(grid);

      document.getElementById('modalOverlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    // ================= Sokak Ekle / Kaldır Yönetimi =================
    let yonetimAktif = false;
    let yonetimSeciliBolgeIdx = null;
    let yonetimSeciliMahalleKey = null;
    let yonetimSeciliMahalleLabel = null;

    // Yönetim panelini aç: bölge seçim ekranıyla başlar
    function yonetimAc() {
      yonetimAktif = true;
      yonetimSeciliBolgeIdx = null;
      yonetimSeciliMahalleKey = null;
      yonetimSeciliMahalleLabel = null;

      document.getElementById('modalBaslik').textContent = '🛠️ Sokak Ekle / Kaldır';
      yonetimBolgeEkraniGoster();

      document.getElementById('modalOverlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    // 1. Adım: Bölge seçimi
    function yonetimBolgeEkraniGoster() {
      yonetimSeciliBolgeIdx = null;
      yonetimSeciliMahalleKey = null;
      yonetimSeciliMahalleLabel = null;

      const body = document.getElementById('modalBody');
      body.innerHTML = '';

      const baslik = document.createElement('div');
      baslik.className = 'modal-alt-baslik';
      baslik.textContent = 'Önce bölge seçin';
      body.appendChild(baslik);

      const grid = document.createElement('div');
      grid.className = 'modal-kisi-grid';

      mahalleGruplari.forEach((grup, idx) => {
        const kart = document.createElement('div');
        kart.className = 'modal-kisi-kart';
        kart.innerHTML = `
          <div class="modal-kisi-ad">Bölge ${idx + 1}</div>
          <div class="modal-kisi-sayi">${grup.mahalleler.length} mahalle</div>
        `;
        kart.onclick = () => yonetimBolgeSec(idx);
        grid.appendChild(kart);
      });

      body.appendChild(grid);
    }

    // 2. Adım: Seçilen bölgedeki mahalleleri göster
    function yonetimBolgeSec(idx) {
      yonetimSeciliBolgeIdx = idx;
      yonetimSeciliMahalleKey = null;
      yonetimSeciliMahalleLabel = null;

      const map = mahalleSokakMap();
      const grup = mahalleGruplari[idx];
      const body = document.getElementById('modalBody');
      body.innerHTML = '';

      const geri = document.createElement('div');
      geri.className = 'modal-geri-satir';
      geri.textContent = '← Bölgelere dön';
      geri.onclick = () => yonetimBolgeEkraniGoster();
      body.appendChild(geri);

      const baslik = document.createElement('div');
      baslik.className = 'modal-alt-baslik';
      baslik.textContent = `Bölge ${idx + 1} — mahalle seçin`;
      body.appendChild(baslik);

      const grid = document.createElement('div');
      grid.className = 'modal-kisi-grid';

      grup.mahalleler.forEach(item => {
        const key = typeof item === 'string' ? item : item.key;
        const label = typeof item === 'string' ? item : item.label;
        const sayi = (map[key] || []).length;

        const kart = document.createElement('div');
        kart.className = 'modal-kisi-kart';
        kart.innerHTML = `
          <div class="modal-kisi-ad">${label}</div>
          <div class="modal-kisi-sayi">${sayi} sokak</div>
        `;
        kart.onclick = () => yonetimMahalleSec(key, label);
        grid.appendChild(kart);
      });

      body.appendChild(grid);
    }

    // 3. Adım: Seçilen mahallede sokak ekle / kaldır ekranı
    function yonetimMahalleSec(key, label) {
      yonetimSeciliMahalleKey = key;
      yonetimSeciliMahalleLabel = label;
      yonetimEkleKaldirEkraniCiz();
    }

    function yonetimEkleKaldirEkraniCiz() {
      const key = yonetimSeciliMahalleKey;
      const label = yonetimSeciliMahalleLabel;
      const map = mahalleSokakMap();
      const body = document.getElementById('modalBody');
      body.innerHTML = '';

      const geri = document.createElement('div');
      geri.className = 'modal-geri-satir';
      geri.textContent = '← Mahallelere dön';
      geri.onclick = () => yonetimBolgeSec(yonetimSeciliBolgeIdx);
      body.appendChild(geri);

      const baslikEkle = document.createElement('div');
      baslikEkle.className = 'modal-alt-baslik';
      baslikEkle.textContent = `${label} — Sokak Ekle`;
      body.appendChild(baslikEkle);

      const inputRow = document.createElement('div');
      inputRow.className = 'yonetim-input-row';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'yonetim-input';
      input.id = 'yonetimSokakInput';
      input.placeholder = 'Örn: Papatya Sokak';
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') yonetimSokakEkleTikla();
      });
      inputRow.appendChild(input);

      const ekleBtn = document.createElement('button');
      ekleBtn.className = 'yonetim-ekle-btn';
      ekleBtn.textContent = '+ Ekle';
      ekleBtn.onclick = () => yonetimSokakEkleTikla();
      inputRow.appendChild(ekleBtn);

      body.appendChild(inputRow);

      const not = document.createElement('div');
      not.className = 'yonetim-not';
      not.textContent = `Eklenen sokak "${label}" mahallesine kaydedilir.`;
      body.appendChild(not);

      const baslikListe = document.createElement('div');
      baslikListe.className = 'modal-alt-baslik';
      const sokaklarListesi = sokaklariSirala(map[key] || []);
      baslikListe.textContent = `Kayıtlı Sokaklar (${sokaklarListesi.length})`;
      body.appendChild(baslikListe);

      if (sokaklarListesi.length === 0) {
        const bos = document.createElement('div');
        bos.className = 'yonetim-bos';
        bos.textContent = 'Bu mahallede henüz sokak yok.';
        body.appendChild(bos);
      } else {
        const liste = document.createElement('div');
        liste.className = 'yonetim-sokak-liste';

        sokaklarListesi.forEach(sokak => {
          const satir = document.createElement('div');
          satir.className = 'yonetim-sokak-satir';

          const ad = document.createElement('div');
          ad.className = 'yonetim-sokak-ad';
          ad.textContent = sokak;
          satir.appendChild(ad);

          const silBtn = document.createElement('button');
          silBtn.className = 'yonetim-sil-btn';
          silBtn.textContent = '✕';
          silBtn.title = 'Sokağı kaldır';
          silBtn.onclick = () => yonetimSokakKaldirTikla(sokak);
          satir.appendChild(silBtn);

          liste.appendChild(satir);
        });

        body.appendChild(liste);
      }
    }

    // Ekle butonuna tıklanınca çalışır
    function yonetimSokakEkleTikla() {
      const input = document.getElementById('yonetimSokakInput');
      const deger = input.value.trim();
      if (!deger) return;

      sokakEkleVeriye(deger, yonetimSeciliMahalleKey);
      yonetimEkleKaldirEkraniCiz();

      // Yeni eklenen sokağın altında input'a odaklan, hızlı ardışık ekleme için
      const yeniInput = document.getElementById('yonetimSokakInput');
      if (yeniInput) yeniInput.focus();
    }

    // Kaldır (✕) butonuna tıklanınca çalışır
    function yonetimSokakKaldirTikla(sokakAdi) {
      sokakKaldirVeriden(sokakAdi);
      yonetimEkleKaldirEkraniCiz();
    }

    // Modalı kapat
    function geriDon() {
      document.getElementById('modalOverlay').classList.add('hidden');
      document.body.style.overflow = '';
      document.querySelectorAll('.btn-mahalle').forEach(b => b.classList.remove('active'));

      if (yonetimAktif) {
        yonetimAktif = false;
        mahalleButonlariYenile();
      }
    }

    // Ana sayfadaki mahalle butonlarını (sokak sayıları/olası ekleme-kaldırmalar sonrası) yeniden oluşturur
    function mahalleButonlariYenile() {
      mahalleButonlariOlustur();
    }

    // Overlay dışına tıklayınca kapat
    function modalKapat(event) {
      if (event.target === document.getElementById('modalOverlay')) {
        geriDon();
      }
    }

    // Sayfa yüklendiğinde butonları ve son aramaları oluştur
    mahalleButonlariOlustur();
    sonAramalariGoster();
  </script>

  <script>
    // ================= Giriş Animasyonu Zamanlaması =================
    (function() {
      var overlay = document.getElementById('introAnim');
      if (!overlay) return;

      var RUN_MS = 950;
      var IMPACT_HOLD_MS = 150;
      var BURST_MS = 500;

      requestAnimationFrame(function() {
        overlay.classList.add('ia-run');
      });

      setTimeout(function() {
        overlay.classList.add('ia-impact');
        document.body.classList.add('ia-shake');
      }, RUN_MS);

      setTimeout(function() {
        document.body.classList.remove('ia-shake');
      }, RUN_MS + 340);

      setTimeout(function() {
        overlay.classList.add('ia-burst');
      }, RUN_MS + IMPACT_HOLD_MS);

      setTimeout(function() {
        if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
      }, RUN_MS + IMPACT_HOLD_MS + BURST_MS + 100);
    })();
  </script>
</body>
</html>
