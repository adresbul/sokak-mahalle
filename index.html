<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sokak ve Bölge Rehberi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-color: #10b981;
            --danger-color: #ef4444;
            --modal-bg: rgba(0, 0, 0, 0.5);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --primary-color: #3b82f6;
            --primary-hover: #60a5fa;
            --accent-color: #34d399;
            --danger-color: #f87171;
            --modal-bg: rgba(0, 0, 0, 0.75);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary-color);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        button {
            cursor: pointer;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-theme {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        select {
            padding-left: 16px;
            width: auto;
            min-width: 180px;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .btn-mic {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0 16px;
        }

        .btn-mic.listening {
            background-color: var(--danger-color);
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .street-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .street-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .street-info .street-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .street-info .region-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--primary-color);
            font-weight: 600;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger-color);
            padding: 6px;
            opacity: 0.6;
        }

        .btn-delete:hover {
            opacity: 1;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 4px;
        }

        /* Modal Structure */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-body label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .modal-body input, .modal-body select {
            padding-left: 12px;
        }

        .modal-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .no-result {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-map-location-dot"></i> Sokak & Bölge Rehberi</h1>
            <div class="header-actions">
                <button class="btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> Yeni Ekle</button>
                <button class="btn-theme" onclick="toggleTheme()" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
            </div>
        </header>

        <div class="search-box">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Sokak veya cadde ara..." oninput="filterStreets()">
            </div>
            <button class="btn-mic" id="micBtn" onclick="sesliAra()" title="Sesle Ara">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <select id="regionFilter" onchange="filterStreets()">
                <option value="ALL">Tüm Bölgeler</option>
            </select>
        </div>

        <div class="stats-bar">
            <span id="totalCount">Toplam: 0 sokak</span>
            <span id="activeFilterText">Filtre: Tümü</span>
        </div>

        <div class="street-list" id="streetList">
            <!-- Sokak kartları dinamik eklenecek -->
        </div>
    </div>

    <!-- Modal: Ekleme Formu -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Yeni Sokak / Bölge Ekle</h3>
                <button class="btn-delete" onclick="closeModal()"><i class="fa-solid fa-xmark fa-lg"></i></button>
            </div>
            <div class="modal-body">
                <label for="modalRegionSelect">Bölge Seçin veya Yeni Bölge Oluşturun:</label>
                <select id="modalRegionSelect" onchange="handleRegionSelectChange()">
                    <!-- Bölgeler yüklenecek -->
                    <option value="NEW">+ Yeni Bölge Ekle...</option>
                </select>

                <div id="newRegionInputGroup" style="display: none;">
                    <label for="newRegionName">Yeni Bölge Adı:</label>
                    <input type="text" id="newRegionName" placeholder="Örn: Balaban 2">
                </div>

                <label for="modalStreetName">Sokak / Cadde Adı:</label>
                <input type="text" id="modalStreetName" placeholder="Örn: Cumhuriyet Caddesi">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">İptal</button>
                <button class="btn-primary" onclick="saveStreet()">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        // Balaban 1 Sokakları Listesi
        const balaban1Sokaklari = [
            "Arslan caddesi", "Cevizlik caddesi", "Cevizlik evleri Sokak", "Çakıroğlu Sokak",
            "Bağcılar Sokak", "Kadımezarı yolu caddesi", "İpekyolu caddesi", "Kuplay Sokak",
            "Ahatlı Sokak", "Arapoğlu Sokak", "Ali oğulları Sokak", "Değirmenkapı caddesi",
            "Cumhuriyet caddesi", "Kara kadılar caddesi", "Hocalar Sokak", "Aydınlık Sokak",
            "Meyvelik Sokak", "Doğaner Sokak", "Demirciler Sokak", "Dizdaroğlu caddesi",
            "Talip Sokak", "Keleşli Sokak", "Şehit İshak Öztürk Sokak", "Şirintepe Sokak",
            "Şirin Yol Sokak", "Artvin Sokak", "Güllüce Sokak", "Özkoç Sokak",
            "Özmen Sokak", "Gümüşçü Sokak", "Uzak sokak", "Karpuzluk Sokak",
            "Nusretiye İzmit caddesi", "Şirinsulhiye İzmit caddesi", "Öğretmenler Sokak", "Kınık Sokak",
            "Tuzla Sokak", "Kadem Sokak", "Teğmen Sokak", "Yeni Sokak",
            "Gülence Sokak", "Kırmalar Sokak", "Şirin ağa caddesi", "Doğuş caddesi",
            "Papatya Sokak", "Uzun yol Sokak", "Rumeli Sokak", "Halk Sokak",
            "Sarmaşıklı Sokak", "Ali Efendi Sokak", "Mescit Sokak", "Mecit Sokak",
            "Barut Sokak", "Ömerağa Sokak", "Turcan Sokak", "Seferağa Sokak",
            "Akarlar Sokak", "Hatıra Sokak", "Destan Sokak", "Deniz kızı Sokak",
            "Gazi Mustafa Kemal Atatürk 120 ve yukarısı", "Fatih caddesi", "Şanlı Sokak", "Ay Sokak",
            "Muazzam Sokak", "Gelişim Sokak", "Demirli Sokak", "Demet Sokak",
            "Asır Sokak", "Orkide Sokak", "Karasu Sokak", "Cesur Sokak",
            "Güneysu sokak", "Ayazköy sokak", "Kırgızlar sokak", "Semt sokak", "Beyazlı sokak"
        ];

        // Varsayılan İlk Veri
        const initialData = balaban1Sokaklari.map((street, index) => ({
            id: index + 1,
            name: street,
            region: "Balaban 1"
        }));

        // Uygulama Durumu (State)
        let streets = JSON.parse(localStorage.getItem('streets_data')) || initialData;

        // Başlangıç Yüklemeleri
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderRegionOptions();
            filterStreets();
        });

        // Tema Yönetimi
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const btn = document.getElementById('themeBtn');
            btn.innerHTML = theme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }

        // Bölgeleri Al
        function getRegions() {
            const regions = [...new Set(streets.map(s => s.region))];
            return regions.sort();
        }

        // Filtre ve Form Bölge Seçeneklerini Doldur
        function renderRegionOptions() {
            const regionFilter = document.getElementById('regionFilter');
            const modalRegionSelect = document.getElementById('modalRegionSelect');
            const regions = getRegions();

            // Arama filtresini güncelle
            regionFilter.innerHTML = '<option value="ALL">Tüm Bölgeler</option>';
            regions.forEach(region => {
                regionFilter.innerHTML += `<option value="${region}">${region}</option>`;
            });

            // Modal bölgesini güncelle
            modalRegionSelect.innerHTML = '';
            regions.forEach(region => {
                modalRegionSelect.innerHTML += `<option value="${region}">${region}</option>`;
            });
            modalRegionSelect.innerHTML += '<option value="NEW">+ Yeni Bölge Ekle...</option>';
        }

        // Sokakları Listele / Filtrele
        function filterStreets() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedRegion = document.getElementById('regionFilter').value;

            const filtered = streets.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(query);
                const matchesRegion = selectedRegion === 'ALL' || item.region === selectedRegion;
                return matchesSearch && matchesRegion;
            });

            renderStreetList(filtered);
            
            // Sayacları güncelle
            document.getElementById('totalCount').innerText = `Toplam: ${filtered.length} sokak`;
            document.getElementById('activeFilterText').innerText = `Filtre: ${selectedRegion === 'ALL' ? 'Tümü' : selectedRegion}`;
        }

        // DOM'a Sokak Kartlarını Yazdır
        function renderStreetList(list) {
            const container = document.getElementById('streetList');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<div class="no-result"><i class="fa-solid fa-circle-exclamation fa-2x"></i><br><br>Aranan kriterlere uygun sokak bulunamadı.</div>';
                return;
            }

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'street-card';
                card.innerHTML = `
                    <div class="street-info">
                        <div class="street-name">${escapeHtml(item.name)}</div>
                        <span class="region-badge">${escapeHtml(item.region)}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteStreet(${item.id})" title="Sil">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // Modal İşlemleri
        function openModal() {
            document.getElementById('addModal').style.display = 'flex';
            handleRegionSelectChange();
        }

        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('modalStreetName').value = '';
            document.getElementById('newRegionName').value = '';
        }

        function handleRegionSelectChange() {
            const select = document.getElementById('modalRegionSelect');
            const newRegionGroup = document.getElementById('newRegionInputGroup');
            
            if (select.value === 'NEW') {
                newRegionGroup.style.display = 'block';
            } else {
                newRegionGroup.style.display = 'none';
            }
        }

        // Yeni Sokak Kaydetme
        function saveStreet() {
            const streetInput = document.getElementById('modalStreetName');
            const regionSelect = document.getElementById('modalRegionSelect');
            const newRegionInput = document.getElementById('newRegionName');

            const streetName = streetInput.value.trim();
            let regionName = regionSelect.value;

            if (regionName === 'NEW') {
                regionName = newRegionInput.value.trim();
            }

            if (!streetName || !regionName) {
                alert('Lütfen sokak adı ve bölge alanlarını doldurunuz!');
                return;
            }

            const newStreet = {
                id: Date.now(),
                name: streetName,
                region: regionName
            };

            streets.push(newStreet);
            saveData();

            closeModal();
            renderRegionOptions();
            filterStreets();
        }

        // Sokak Silme
        function deleteStreet(id) {
            if (confirm('Bu sokağı silmek istediğinize emin misiniz?')) {
                streets = streets.filter(s => s.id !== id);
                saveData();
                renderRegionOptions();
                filterStreets();
            }
        }

        // LocalStorage Kayıt
        function saveData() {
            localStorage.setItem('streets_data', JSON.stringify(streets));
        }

        // Sesli Arama (Web Speech API)
        function sesliAra() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("Tarayıcınız sesli arama özelliğini desteklemiyor.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            const micBtn = document.getElementById('micBtn');

            recognition.onstart = () => {
                micBtn.classList.add('listening');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('searchInput').value = transcript;
                filterStreets();
            };

            recognition.onerror = () => {
                micBtn.classList.remove('listening');
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
            };

            recognition.start();
        }

        // XSS Önlemi
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
